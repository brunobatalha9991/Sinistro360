<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinistro360 — Integração CORP</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--brand:#2563eb;--ok:#16a34a;--warn:#f59e0b;--danger:#dc2626;--sidebar:#0f172a;--sidebar-ink:#cbd5e1;}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:var(--brand);text-decoration:none;cursor:pointer}
.hidden{display:none!important}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--sidebar);color:var(--sidebar-ink);flex-shrink:0;display:flex;flex-direction:column}
.sidebar .brand{padding:18px 20px;font-size:18px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1e293b}
.sidebar nav{padding:10px 0;flex:1}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--sidebar-ink);font-size:14px}
.sidebar nav a:hover{background:#1e293b;color:#fff}
.sidebar nav a.active{background:var(--brand);color:#fff}
.sidebar .ver{padding:12px 20px;font-size:11px;color:#475569}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar .crumb{color:var(--muted);font-size:13px}
.topbar .user{display:flex;align-items:center;gap:12px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.content{padding:24px;overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.page-head h1{margin:0;font-size:22px}.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.btn{background:var(--brand);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{opacity:.92}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:5px 11px;font-size:12px}.btn.xs{padding:3px 8px;font-size:11px}.btn.danger{background:var(--danger)}.btn.ok{background:var(--ok)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
select.inline,input.inline{width:auto;display:inline-block}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600}
.field{margin-bottom:14px}
.grid{display:grid;gap:14px}.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}.grid.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip-btn{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.blue{background:#eff6ff;color:#2563eb}.badge.green{background:#dcfce7;color:#16a34a}.badge.amber{background:#fef3c7;color:#b45309}.badge.red{background:#fee2e2;color:#dc2626}.badge.gray{background:#f1f5f9;color:#64748b}.badge.purple{background:#f3e8ff;color:#9333ea}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;min-width:150px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#f8fafc}.mono{font-variant-numeric:tabular-nums}.right{text-align:right}
.detail-head{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.detail-head h1{margin:0 0 6px;font-size:20px}.detail-head .sub{color:var(--muted);font-size:13px}
.detail-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs .tab{padding:10px 16px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;border-bottom:2px solid transparent}
.tabs .tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.kv{display:grid;grid-template-columns:210px 1fr;gap:2px 16px}
.kv dt{color:var(--muted);padding:8px 0;font-size:12px;border-bottom:1px solid #f1f5f9}
.kv dd{margin:0;padding:8px 0;font-size:13px;border-bottom:1px solid #f1f5f9;word-break:break-word}
.journey{position:relative}
.jstep{display:flex;gap:14px;position:relative;padding-bottom:20px}
.jstep::before{content:"";position:absolute;left:13px;top:30px;bottom:-2px;width:2px;background:var(--line)}
.jstep:last-child::before{display:none}
.jdot{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;background:#cbd5e1;z-index:1;margin-top:2px}
.jdot.done{background:var(--ok)}.jdot.current{background:var(--brand);box-shadow:0 0 0 4px #dbeafe}
.jbody{flex:1;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.jbody.done{background:#f0fdf4;border-color:#bbf7d0}
.jhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.jbody h4{margin:0;font-size:14px}
.jrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.jrow .field{margin:0}
.status{padding:10px 12px;border-radius:8px;font-size:13px;margin-top:12px}
.status.ok{background:#dcfce7;color:#166534}.status.err{background:#fee2e2;color:#991b1b}.status.info{background:#eff6ff;color:#1e40af}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.stat-cards{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .n{font-size:26px;font-weight:700}.stat .l{color:var(--muted);font-size:12px;margin-top:2px}
.muted{color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.tag-manual{background:#fef9c3;color:#854d0e;font-size:10px;padding:2px 6px;border-radius:5px;font-weight:600;margin-left:6px}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ==========================================================================

  el:function(t,a,c){var e=document.createElement(t);a=a||{};for(var k in a){if(k==="text")e.textContent=a[k];else if(k==="html")e.innerHTML=a[k];else if(k==="class")e.className=a[k];else if(k.indexOf("on")===0&&typeof a[k]==="function")e.addEventListener(k.slice(2).toLowerCase(),a[k]);else if(a[k]!=null)e.setAttribute(k,a[k]);}(c||[]).forEach(function(x){if(x!=null)e.appendChild(typeof x==="string"?document.createTextNode(x):x);});return e;},

var CFG_KEY="corp_cfg",TOKEN_KEY="corp_token",DATA_KEY="corp_claims",OVR_KEY="corp_overrides",ROLE_KEY="corp_role";
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY))||{};}catch(e){return{};}}

function getToken(){return localStorage.getItem(TOKEN_KEY)||"";}

function loadClaims(){try{return JSON.parse(localStorage.getItem(DATA_KEY))||[];}catch(e){return[];}}
function saveClaims(a){localStorage.setItem(DATA_KEY,JSON.stringify(a));}
/* ---- Overrides (edições manuais que NUNCA se perdem) ---- */
function loadOvr(){try{return JSON.parse(localStorage.getItem(OVR_KEY))||{};}catch(e){return{};}}

function getRole(){return localStorage.getItem(ROLE_KEY)||"admin";}

/* ---------- API CORP ---------- */
var CorpAPI=(function(){
  function base(){var u=(getCfg().url||"").trim().replace(/\/+$/,"");if(u&&!/^https?:\/\//.test(u))u="https://"+u;return u;}
  function request(path,opts){opts=opts||{};var h={};if(opts.body)h["Content-Type"]="application/json";if(opts.auth!==false){var t=getToken();if(t)h["Authorization"]=t;}
    return fetch(base()+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined}).then(function(r){
      return r.text().then(function(txt){var d;try{d=JSON.parse(txt);}catch(e){d=txt;}if(!r.ok){var m=(d&&(d.message||d.mensagem))||("HTTP "+r.status);var er=new Error(m);er.status=r.status;er.data=d;throw er;}return d;});});}

  function fetchSinistros(params){params=params||{};var hj=new Date(),ini=new Date();ini.setFullYear(hj.getFullYear()-5);function br(d){var dd=("0"+d.getDate()).slice(-2),mm=("0"+(d.getMonth()+1)).slice(-2);return dd+"/"+mm+"/"+d.getFullYear();}var def={tipo_sinistro:"S",data_inicial:br(ini),data_final:br(hj),tipo_data:"OCO",situacao:"T",qtd_pag:100,pagina:1};for(var k in params)def[k]=params[k];var qs=Object.keys(def).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(def[k]);}).join("&");return withAuth(function(){return request("/sinistros?"+qs,{method:"GET"});});}
  function testConnection(){setToken("");return login().then(function(){return true;});}
  return{login:login,fetchSinistros:fetchSinistros,testConnection:testConnection,base:base};
})();

function mapSituacao(s){s=String(s||"").toUpperCase();if(s.indexOf("INDENIZ")>=0)return{label:"Indenizado",cls:"green"};if(s.indexOf("ENCERR")>=0)return{label:"Encerrado",cls:"gray"};if(s.indexOf("ANDAMENTO")>=0)return{label:"Em andamento",cls:"amber"};if(s.indexOf("PENDENTE")>=0)return{label:"Pendente",cls:"amber"};if(s.indexOf("NEGAD")>=0||s.indexOf("RECUS")>=0)return{label:"Negado",cls:"red"};if(s.indexOf("ABERT")>=0)return{label:"Aberto",cls:"blue"};return{label:(s||"—"),cls:"blue"};}
function mapCorp(c){return{id:"clm_"+(c.codfil||"0")+"_"+(c.nosnum||U.uid("")),codfil:c.codfil,nosnum:c.nosnum,numsin:c.numsin||"",tipo:c.tipo||"",codigo:c.codigo,segurado:c.segurado||"",cia:c.cia||"",ramo:c.ramo||"",numapo:c.numapo||"",numend:c.numend||"",item:c.item,placa:c.placa||"",situacao:c.situacao||"",franquia:Number(c.franquia)||0,valavi:Number(c.valavi)||0,valind:Number(c.valind)||0,valdes:Number(c.valdes)||0,datavi:U.isoFromBR(c.datavi),datoco:U.isoFromBR(c.datoco),datenc:U.isoFromBR(c.datenc),datvis:U.isoFromBR(c.datvis),datlib:U.isoFromBR(c.datlib),proxima_agenda:U.isoFromBR(c.proxima_agenda),agendamento:U.isoFromBR(c.agendamento),responsavel:c.responsavel||"",oficina:c.oficina?String(c.oficina).trim():"",tipo_atendimento:c.tipo_atendimento||"",descricao:c.descricao||"",observacoes:c.observacoes||"",_raw:c};}

/* ==========================================================================
   JORNADA — definição de etapas por caminho
   ========================================================================== */
var STATUS_DEFAULT=["Aguardando","Em andamento","Concluído"];
function stepsFixed(){ return [
  {id:"vistoria",title:"Vistoria",fixed:true,type:"status"},
  {id:"caminho",title:"Definir caminho (Perda Parcial / Perda Integral)",fixed:true,type:"caminho"}
];}
function stepsParcial(){ return [
  {id:"rep_autorizados",title:"Reparos autorizados",type:"status"},
  {id:"pecas",title:"Peças",type:"status"},
  {id:"reparo",title:"Reparo",type:"status"},
  {id:"conclusao",title:"Conclusão",type:"status"}
];}
function stepsIntegral(){ return [
  {id:"documentacao",title:"Documentação",type:"status"},
  {id:"transf",title:"Transf. do veículo",type:"status"},
  {id:"analise_final",title:"Análise final",type:"status"},
  {id:"conclusao",title:"Conclusão",type:"status"}
];}
/* Monta a jornada efetiva a partir do override salvo */
function getJourney(claimId){
  var ovr=getOvr(claimId);
  var jr=ovr.journey;
  if(!jr){
    jr={caminho:"",steps:stepsFixed().map(function(s){return baseStep(s);})};
  }
  return jr;
}
function baseStep(def){
  return {id:def.id||U.uid("st"),title:def.title,fixed:!!def.fixed,type:def.type||"status",
    statusOptions:def.statusOptions||STATUS_DEFAULT.slice(),status:def.status||"",date:def.date||"",note:def.note||""};
}
function saveJourney(claimId,jr){ setOvr(claimId,{journey:jr}); }
/* Recalcula etapas quando muda o caminho, preservando o que já existe */
function applyCaminho(jr,caminho){
  jr.caminho=caminho;
  var fixed=jr.steps.filter(function(s){return s.fixed;});
  var extra=(caminho==="parcial"?stepsParcial():caminho==="integral"?stepsIntegral():[]);
  // preserva status/date/opções de etapas já existentes com mesmo id
  var existingById={};jr.steps.forEach(function(s){existingById[s.id]=s;});
  var novos=extra.map(function(def){
    if(existingById[def.id]) return existingById[def.id];
    return baseStep(def);
  });
  // mantém também etapas customizadas criadas pelo admin (não fixas e não do template)
  var templateIds=extra.map(function(d){return d.id;});
  var custom=jr.steps.filter(function(s){return !s.fixed && templateIds.indexOf(s.id)<0 && (s._custom);});
  jr.steps=fixed.concat(novos).concat(custom);
  return jr;
}

/* ==========================================================================
   ESTADO / ROTEAMENTO
   ========================================================================== */
var State={route:"dashboard",param:null,claims:loadClaims(),session:{name:"Marina Costa"}};
function navigate(r,p){State.route=r;State.param=p||null;location.hash="#/"+r+(p?"/"+p:"");render();}
window.addEventListener("hashchange",function(){var h=location.hash.replace(/^#\//,"").split("/");if(h[0]!==State.route||(h[1]||null)!==State.param){State.route=h[0]||"dashboard";State.param=h[1]||null;render();}});

var MENU=[["dashboard","Dashboard","▣"],["sinistros","Sinistros","⚠"],["clientes","Clientes","☺"],["seguradoras","Seguradoras","⛨"],["oficinas","Oficinas/Prestadores","⚒"],["relatorios","Relatórios","▦"],["integracao","Integração CORP","⟳"],["config","Configurações","⚙"]];

  var side=U.el("div",{class:"sidebar"},[U.el("div",{class:"brand"},[U.el("span",{text:"◆"}),U.el("span",{text:"Sinistro360"})]),nav,U.el("div",{class:"ver",text:"v3.0 • Integração CORP"})]);
  var roleSel=U.el("select",{class:"inline",onchange:function(e){setRole(e.target.value);render();}},[
    U.el("option",{value:"admin",text:"Perfil: Administrador",selected:getRole()==="admin"?"selected":null}),
    U.el("option",{value:"user",text:"Perfil: Usuário comum",selected:getRole()==="user"?"selected":null})
  ]);
  var initials=State.session.name.split(" ").map(function(w){return w[0];}).slice(0,2).join("");
  var top=U.el("div",{class:"topbar"},[U.el("div",{class:"crumb",text:"Sinistro360 › "+(crumb||"")}),U.el("div",{class:"user"},[roleSel,U.el("div",{class:"avatar",text:initials})])]);
  return U.el("div",{class:"app"},[side,U.el("div",{class:"main"},[top,U.el("div",{class:"content"},[inner])])]);
}
function emptyState(m){return U.el("div",{class:"muted",style:"padding:30px;text-align:center",text:m});}
function stat(n,l){return U.el("div",{class:"stat"},[U.el("div",{class:"n",text:String(n)}),U.el("div",{class:"l",text:l})]);}

var Pages={};
Pages.dashboard=function(){
  var cs=State.claims,byStatus={};cs.forEach(function(c){var l=mapSituacao(c.situacao).label;byStatus[l]=(byStatus[l]||0)+1;});
  var totalInd=cs.reduce(function(a,c){return a+(c.valind||0);},0);
  return shell(U.el("div",{},[
    U.el("div",{class:"page-head"},[U.el("div",{},[U.el("h1",{text:"Dashboard"}),U.el("p",{text:"Visão geral dos sinistros importados da API CORP"})])]),
    U.el("div",{class:"stat-cards"},[stat(cs.length,"Sinistros sincronizados"),stat(byStatus["Em andamento"]||0,"Em andamento"),stat(byStatus["Indenizado"]||0,"Indenizados"),stat(U.money(totalInd),"Total indenizado")]),
    U.el("div",{class:"card"},[U.el("h3",{text:"Últimos sinistros",style:"margin-top:0"}),cs.length?claimsTable(cs.slice(0,8)):emptyState("Nenhum sinistro sincronizado ainda.")])
  ]),"Dashboard");
};
var listFilter={status:"todos",q:""};
Pages.sinistros=function(){
  var chips=[["todos","Todos"],["Aberto","Abertos"],["Em andamento","Em andamento"],["Pendente","Pendentes"],["Indenizado","Indenizados"],["Encerrado","Encerrados"],["Negado","Negados"]];
  var chipRow=U.el("div",{class:"chips"},chips.map(function(c){return U.el("div",{class:"chip-btn"+(listFilter.status===c[0]?" active":""),text:c[1],onclick:function(){listFilter.status=c[0];render();}});}));
  var listWrap=U.el("div",{id:"listWrap"});
  function renderList(){var q=listFilter.q.toLowerCase();var rows=State.claims.filter(function(c){if(listFilter.status!=="todos"&&mapSituacao(c.situacao).label!==listFilter.status)return false;if(!q)return true;return[c.segurado,c.placa,c.numsin,c.numapo,c.cia].join(" ").toLowerCase().indexOf(q)>=0;});listWrap.innerHTML="";listWrap.appendChild(rows.length?claimsTable(rows):emptyState("Nenhum sinistro encontrado."));}
  setTimeout(renderList,0);
  var toolbar=U.el("div",{class:"toolbar"},[U.el("input",{placeholder:"Buscar por segurado, placa, nº sinistro...",value:listFilter.q,oninput:function(e){listFilter.q=e.target.value;renderList();}}),U.el("button",{class:"btn sec sm",text:"Exportar CSV",onclick:exportCSV}),U.el("button",{class:"btn ghost sm",text:"↻ Sincronizar",onclick:function(){navigate("integracao");}})]);
  return shell(U.el("div",{},[U.el("div",{class:"page-head"},[U.el("div",{},[U.el("h1",{text:"Sinistros"}),U.el("p",{text:"Todos os sinistros da API CORP ("+State.claims.length+" registros)"})]),U.el("button",{class:"btn",text:"↻ Sincronizar",onclick:function(){navigate("integracao");}})]),U.el("div",{class:"card"},[chipRow,toolbar,listWrap])]),"Sinistros");
};

function journeyPanel(c){

  function persist(){ saveJourney(c.id,jr); }

  var stepsEl=U.el("div",{class:"journey"});

    var done=(step.status||"").toLowerCase().indexOf("conclu")>=0;
    var dotState=done?"done":(step.status?"current":"");
    var bodyChildren=[];
    // Cabeçalho da etapa
    var titleEl;
    if(isAdmin && !step.fixed){
      titleEl=U.el("input",{class:"inline",value:step.title,style:"font-weight:700;min-width:220px",onchange:function(e){step.title=e.target.value;persist();}});

    if(step.type==="caminho"){
      // Etapa "Definir caminho"

        U.el("option",{value:"",text:"— Selecione —",selected:!jr.caminho?"selected":null}),
        U.el("option",{value:"parcial",text:"Perda Parcial",selected:jr.caminho==="parcial"?"selected":null}),
        U.el("option",{value:"integral",text:"Perda Integral",selected:jr.caminho==="integral"?"selected":null})
      ]);
      bodyChildren.push(U.el("div",{class:"jrow"},[U.el("div",{class:"field"},[U.el("label",{text:"Caminho do sinistro"}),sel])]));
      if(jr.caminho) bodyChildren.push(U.el("div",{class:"muted",style:"margin-top:6px;font-size:12px",text:jr.caminho==="parcial"?"Perda Parcial: reparos autorizados, peças, reparo e conclusão.":"Perda Integral: documentação, transferência, análise final e conclusão."}));

        U.el("div",{class:"field"},[U.el("label",{text:"Data"}),dateInput])
      ]));
      var noteInput=U.el("input",{value:step.note||"",placeholder:"Observação desta etapa...",onchange:function(e){step.note=e.target.value;persist();}});

/* Gerenciador de opções de status de uma etapa (incluir/editar/excluir) */

      U.el("span",{text:op}),
      U.el("a",{text:"✎",title:"Editar",onclick:function(){var nv=prompt("Editar status:",op);if(nv){step.statusOptions[i]=nv.trim();if(step.status===op)step.status=nv.trim();persist();rerender();}}}),
      U.el("a",{text:"✕",title:"Excluir",style:"color:#dc2626",onclick:function(){step.statusOptions.splice(i,1);if(step.status===op)step.status="";persist();rerender();}})

  box.appendChild(list);
  box.appendChild(U.el("div",{style:"display:flex;gap:6px;align-items:center"},[addInput,addBtn]));
  return box;
}

  function pagina(p){return CorpAPI.fetchSinistros({pagina:p}).then(function(resp){var arr=Array.isArray(resp)?resp:((resp&&(resp.sinistros||resp.sinistro||resp.dados||resp.data||resp.itens||resp.registros))||[]);arr.forEach(function(raw){var m=mapCorp(raw);if(byId[m.id])atualizados++;else novos++;byId[m.id]=m;});if(arr.length>=100&&p<100)return pagina(p+1);State.claims=Object.keys(byId).map(function(k){return byId[k];});saveClaims(State.claims);return{total:State.claims.length,novos:novos,atualizados:atualizados};});}
  return pagina(1);
}
