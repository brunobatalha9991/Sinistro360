<style>

  --green:#3ec070;--amber:#f0c030;--orange:#ff8a2b;--red:#ff5c5c;--red-dk:#c23a3a;

  --text:#e6edf5;--text-2:#a9b6c4;--muted:#7d8b9a;--shadow:0 2px 12px rgba(0,0,0,.4);

*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:var(--blue);text-decoration:none}button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue-lt);outline-offset:2px}

.skip-link:focus{left:0}

.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:var(--blue);color:#fff}

.shell.collapsed .nav a span,.shell.collapsed .brand span{display:none}
.sidebar-foot{padding:12px;font-size:11px;color:#8ba0b8;border-top:1px solid rgba(255,255,255,.08)}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.iconbtn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 9px;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{background:var(--surface-2)}

.content{padding:18px;max-width:1400px;width:100%;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 10px}
.page-head{margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.page-sub{color:var(--text-2);font-size:13px;margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}

.stat{cursor:pointer;transition:transform .12s}.stat:hover{transform:translateY(-2px);border-color:var(--blue)}
.stat .n{font-size:26px;font-weight:700}.stat .l{color:var(--text-2);font-size:12.5px}
.stat .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:8px;color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 15px;font-size:13.5px;font-weight:600}
.btn:hover{filter:brightness(1.07)}.btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn.sec:hover{background:var(--surface-2)}.btn.danger{background:var(--red)}.btn.sm{padding:5px 10px;font-size:12px}

.b-gray{background:#e6ebf1;color:#556}.b-blue{background:#dbe9ff;color:#1c5bbf}.b-green{background:#d7f2e0;color:#1c7a42}
.b-amber{background:#fdf0cc;color:#8a6800}.b-red{background:#fcdcdc;color:#a02525}.b-orange{background:#ffe3cc;color:#a34e00}.b-reddk{background:#f3c9c9;color:#6e1010}
[data-theme="dark"] .b-gray{background:#2a3646;color:#b0bccb}[data-theme="dark"] .b-blue{background:#1c3556;color:#8fbdff}
[data-theme="dark"] .b-green{background:#173a26;color:#6fdb98}[data-theme="dark"] .b-amber{background:#3a3014;color:#f0c94f}
[data-theme="dark"] .b-red{background:#3f1b1b;color:#ff9a9a}[data-theme="dark"] .b-orange{background:#3a2410;color:#ffab5c}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}

.field{margin-bottom:13px}.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}.field .req{color:var(--red)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13.5px;font-family:inherit}

input:focus,select:focus,textarea:focus{border-color:var(--blue)}
[aria-invalid="true"]{border-color:var(--red)!important}

@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}

.pill-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

.toast{background:var(--surface);border-left:4px solid var(--blue);border-radius:8px;padding:11px 15px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px;max-width:340px}
.toast.ok{border-color:var(--green)}.toast.err{border-color:var(--red)}.toast.warn{border-color:var(--amber)}
.timeline{display:flex;overflow-x:auto;padding:6px 2px 14px}
.tl-step{flex:0 0 145px;text-align:center;position:relative;padding:0 6px}
.tl-step:not(:last-child)::after{content:"";position:absolute;top:20px;left:60%;right:-40%;height:3px;background:var(--border)}
.tl-dot{width:40px;height:40px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#fff;position:relative;z-index:2;border:3px solid var(--surface)}
.tl-name{font-size:12px;font-weight:600}.tl-meta{font-size:11px;color:var(--text-2);margin-top:2px}
.tl-step button{background:none;border:none;color:var(--text);width:100%;padding:0}
.tl-step button{background:none;border:none;padding:0;width:100%;cursor:pointer}
@media(max-width:760px){.timeline{flex-direction:column}.tl-step{flex:none;text-align:left;padding:0 0 16px}
.tl-step:not(:last-child)::after{top:40px;bottom:-6px;left:20px;right:auto;width:3px;height:auto}
.tl-step button{display:flex;gap:12px;text-align:left;align-items:flex-start}}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{background:none;border:none;padding:10px 14px;font-size:13px;color:var(--text-2);border-bottom:3px solid transparent;font-weight:600;white-space:nowrap}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
.empty{text-align:center;padding:40px 16px;color:var(--text-2)}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--text-2)}.kv dd{margin:0;font-weight:500}
.note{background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--amber);border-radius:8px;padding:11px 14px;font-size:12.5px;color:var(--text-2);margin:12px 0}
.note.info{border-left-color:var(--blue)}.note.danger{border-left-color:var(--red)}
.bar-chart{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-size:12px}
.bar{height:16px;background:var(--blue);border-radius:4px;min-width:2px}
.progress{height:8px;background:var(--border);border-radius:6px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kcol{background:var(--surface-2);border-radius:10px;padding:10px}.kcol h4{margin:0 0 8px;font-size:12.5px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px;margin-bottom:8px;font-size:12.5px}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--navy-2));padding:16px}
.login-card{background:var(--surface);border-radius:14px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-users{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.quser{border:1px solid var(--border);border-radius:8px;padding:9px;text-align:left;background:var(--surface)}
.quser:hover{border-color:var(--blue)}.quser b{display:block;font-size:12.5px}.quser small{color:var(--text-2);font-size:11px}
.test-item{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12.5px;display:flex;gap:8px}
.test-item.pass{color:var(--green)}.test-item.fail{color:var(--red)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
@media(max-width:900px){.shell,.shell.collapsed{grid-template-columns:1fr}
.sidebar{position:fixed;left:-280px;width:270px;z-index:150;transition:left .2s}
.shell.mobile-open .sidebar{left:0}.shell.collapsed .nav a span,.shell.collapsed .brand span{display:inline}
.kv{grid-template-columns:1fr}}
</style>

<body>
<a href="#main" class="skip-link">Pular para o conteúdo</a>
<div id="app" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="assertive"></div>
<script>
"use strict";
/* ===== SINISTRO360 — documento único. Ambiente de DEMONSTRAÇÃO. Não usar dados reais. Não pronto p/ produção. ===== */
window.Sinistro360={config:{},constants:{},state:{},utils:{},data:{},repositories:{},services:{},components:{},pages:{},tests:{}};
const S=window.Sinistro360;

/* 1. CONFIGURAÇÃO */
S.config=Object.freeze({appName:"Sinistro360",version:"1.0.0-demo",schemaVersion:1,workflowModelVersion:"2026.1",
  generatedAt:"2026-08-01",totalLossThreshold:75,
  keys:Object.freeze({db:"sinistro360.database.v1",session:"sinistro360.session.v1",prefs:"sinistro360.preferences.v1",tests:"sinistro360.tests.v1"})});

/* 2. CONSTANTES */
const C=S.constants=Object.freeze({
  ROLES:Object.freeze({ADMIN:"Administrador",MANAGER:"Gestor",ANALYST:"Analista",VIEWER:"Consulta"}),
  GENERAL_STATUS:Object.freeze(["Rascunho","Aberto","Em andamento","Suspenso","Encerrado","Cancelado"]),
  STAGE_SITUATION:Object.freeze(["Não iniciada","Pendente","Em andamento","Aguardando cliente","Aguardando corretora","Aguardando seguradora","Aguardando oficina","Aguardando prestador","Aguardando peças","Bloqueada","Atrasada","Concluída","Dispensada","Cancelada"]),
  BRANCH:Object.freeze(["Ainda não definido","Perda parcial/reparos","Perda total/indenização","Outro tratamento","Encerrado sem indenização","Cancelado"]),
  NEXT_RESP:Object.freeze(["Cliente","Corretora","Seguradora","Regulador/perito","Oficina","Fornecedor de peças","Despachante","Instituição financeira","Outro"]),
  DOC_SITUATION:Object.freeze(["Não solicitado","Solicitado","Recebido","Em conferência","Aprovado","Rejeitado","Dispensado"]),
  INSPECTION_SIT:Object.freeze(["Não solicitada","Solicitada","Aguardando agendamento","Agendada","Pendente de realização","Realizada","Aguardando laudo","Concluída","Dispensada","Cancelada"]),
  ASSIST_CAT:Object.freeze(["Reboque","Socorro mecânico","Chaveiro","Troca de pneu","Pane seca","Assistência residencial","Eletricista","Encanador","Vidraceiro","Outros"]),
  ASSIST_STATUS:Object.freeze(["Solicitada","Em triagem","Aguardando prestador","Prestador acionado","Prestador a caminho","Em atendimento","Concluída","Cancelada"]),
  BLOCKER_CAT:Object.freeze(["Documento pendente","Retorno do cliente","Retorno da seguradora","Agendamento de vistoria","Laudo pendente","Orçamento pendente","Autorização pendente","Peça sem estoque","Peça em fabricação","Backorder","Logística internacional","Oficina sem disponibilidade","Pendência financeira","Débito do veículo","Pendência documental","Pendência jurídica","Carro reserva indisponível","Outro"]),
  CHANNELS:Object.freeze(["Telefone","WhatsApp","E-mail","Portal","Presencial","Outro"]),
  TASK_PRIORITY:Object.freeze(["Baixa","Média","Alta","Crítica"]),
  TASK_STATUS:Object.freeze(["Aberta","Em andamento","Concluída","Cancelada"]),
  HOLIDAYS_2026:Object.freeze(["2026-01-01","2026-02-16","2026-02-17","2026-04-03","2026-04-21","2026-05-01","2026-06-04","2026-09-07","2026-10-12","2026-11-02","2026-11-15","2026-11-20","2026-12-25"])
});

/* 3. CONTRATOS JSDoc (resumidos)
 * @typedef {Object} ClaimStageInstance {name,order,situation,resp,startDate,minDate,dueDate,originalDueDate,doneDate,blockers[]}
 * @typedef {Object} ClaimWorkflowInstance {modelId,version,branch,currentStage,stages[]}
 * @typedef {Object} Claim {id,protocol,insurerClaimNo,clientId,vehicle,plate,insurerId,workflow,documents[],inspection,analysis,repair,indemnity,timeline[],audit[],blockers[],...}
 */

/* 4. ESTADO */
S.state={session:null,prefs:{theme:"light",sidebarCollapsed:false,claimFilters:{}},storageOk:true};

/* 5. UTILITÁRIOS */
const U=S.utils;
U.uid=(p="id")=>p+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
U.clone=(o)=>JSON.parse(JSON.stringify(o));
U.byId=(a,id)=>a.find(x=>x.id===id)||null;
U.escapeHtml=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
U.el=(tag,attrs={},children=[])=>{const e=document.createElement(tag);
  for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k==="text")e.textContent=attrs[k];
    else if(k==="html")e.innerHTML=attrs[k];else if(k.startsWith("on")&&typeof attrs[k]==="function")e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!=null)e.setAttribute(k,attrs[k]);}
  (Array.isArray(children)?children:[children]).forEach(c=>{if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;};
U.debounce=(fn,ms=250)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
U.todayISO=()=>new Date().toISOString().slice(0,10);
U.nowISO=()=>new Date().toISOString();
U.daysBetween=(a,b)=>Math.floor((new Date(b)-new Date(a))/86400000);

/* ===== Integração CORP via API ===== */
var CorpAPI = (function(){
  var CFG_KEY = "corp_api_cfg";
  var TOKEN_KEY = "corp_api_token";

  function getCfg(){
    try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function setCfg(cfg){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
  function getToken(){ return localStorage.getItem(TOKEN_KEY) || ""; }
  function setToken(t){ if(t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }

  function baseUrl(){
    var b = (getCfg().baseUrl || "").trim();
    return b.replace(/\/+$/, ""); // remove barra final
  }

  // Faz a requisição e trata CORS/erros de forma clara
  function request(path, opts){
    opts = opts || {};
    var url = baseUrl() + path;
    var headers = opts.headers || {};
    headers["Content-Type"] = "application/json";
    if(opts.auth !== false){
      var tk = getToken();
      if(tk) headers["Authorization"] = tk;
    }
    return fetch(url, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(res){
      return res.text().then(function(txt){
        var data = null;
        try { data = txt ? JSON.parse(txt) : null; } catch(e){ data = txt; }
        if(!res.ok){
          var err = new Error("HTTP " + res.status);
          err.status = res.status; err.body = data;
          throw err;
        }
        return data;
      });
    }).catch(function(e){
      // fetch lança TypeError quando é bloqueio de CORS ou rede
      if(e instanceof TypeError){
        var ce = new Error("Falha de conexão/CORS. O navegador bloqueou a chamada para a API. "
          + "Isso é esperado ao abrir o HTML direto do disco. Veja as observações no final.");
        ce.cors = true;
        throw ce;
      }
      throw e;
    });
  }

  function login(){
    var cfg = getCfg();
    if(!cfg.baseUrl || !cfg.email || !cfg.senha){
      return Promise.reject(new Error("Preencha URL, e-mail e senha em Configurações → Integração CORP."));
    }
    return request("/login", {
      method: "POST",
      auth: false,
      body: { email: cfg.email, senha: cfg.senha, aplicacao: (cfg.aplicacao != null ? cfg.aplicacao : 0) }
    }).then(function(data){
      // O token pode vir em diferentes nomes; tentamos os mais comuns
      var tk = data && (data.token || data.access_token || data.token_auth
        || (data.data && (data.data.token || data.data.access_token)));
      if(!tk) throw new Error("Login OK, mas não encontrei o token na resposta. Resposta: " + JSON.stringify(data).slice(0,300));
      setToken(tk);
      return tk;
    });
  }

  // Garante que há token válido antes de chamar um endpoint protegido
  function withAuth(fn){
    if(getToken()) {
      return fn().catch(function(e){
        if(e.status === 401 || e.status === 403){
          setToken(null);
          return login().then(fn); // token expirou -> refaz login
        }
        throw e;
      });
    }
    return login().then(fn);
  }

  // Busca a lista de sinistros/assistências no CORP
  function fetchSinistros(params){
    params = params || {};
    // Parâmetros que os endpoints do CORP costumam exigir (evita erro 500).
    // Formato de data dd/mm/aaaa, conforme a documentação (/producao).
    var hoje = new Date();
    var umAnoAtras = new Date(); umAnoAtras.setFullYear(hoje.getFullYear() - 1);
    function br(d){ var dd=("0"+d.getDate()).slice(-2), mm=("0"+(d.getMonth()+1)).slice(-2); return dd+"/"+mm+"/"+d.getFullYear(); }
    var defaults = {
      texto: "",
      dt_ini: br(umAnoAtras),
      dt_fim: br(hoje),
      ordem: "datpro",
      orientacao: "desc",
      pagina: 1,
      limite: 100
    };
    var merged = {};
    for(var k in defaults) merged[k] = defaults[k];
    for(var k2 in params) merged[k2] = params[k2];
    var qs = Object.keys(merged).map(function(k){
      return encodeURIComponent(k) + "=" + encodeURIComponent(merged[k]);
    }).join("&");
    var path = "/sinistros?" + qs;
    return withAuth(function(){ return request(path, { method: "GET" }); });
  }


  // Atualiza um sinistro no CORP
  function updateSinistro(payload){
    return withAuth(function(){
      return request("/sinistros", { method: "PUT", body: payload });
    });
  }

  function logout(){
    if(!getToken()) return Promise.resolve();
    return request("/logout", { method: "POST" })
      .catch(function(){})
      .then(function(){ setToken(null); });
  }

  return {
    getCfg: getCfg, setCfg: setCfg,
    getToken: getToken, setToken: setToken,
    login: login, logout: logout,
    fetchSinistros: fetchSinistros, updateSinistro: updateSinistro
  };
})();

      lastUpdate:U.todayISO(),
      _raw:c
    };
  }

  function upsert(mapped){
    var existing = R.ClaimRepository.all().find(function(x){
      return x.corpId && mapped.corpId && String(x.corpId) === String(mapped.corpId);
    });
    if(existing){
      // Atualiza os campos vindos do CORP, preservando o trabalho local
      R.ClaimRepository.update(existing.id, {
        protocol: mapped.protocol,
        insurerClaimNo: mapped.insurerClaimNo,
        generalStatus: mapped.generalStatus,
        thirdPartyOwner: mapped.thirdPartyOwner,
        plate: mapped.plate,
        vehicle: mapped.vehicle,
        insurerName: mapped.insurerName,
        corpType: mapped.corpType,
        linkedFromApi: true,
        _raw: mapped._raw,
        lastUpdate: U.todayISO()
      });
      return "updated";
    } else {
      R.ClaimRepository.create(mapped);
      return "created";
    }
  }

  function sync(params){
    return CorpAPI.fetchSinistros(params).then(function(resp){
      var arr = Array.isArray(resp) ? resp
        : (resp && (resp.sinistros || resp.data || resp.itens || resp.registros)) || [];
      var created = 0, updated = 0;
      arr.forEach(function(c){
        var r = upsert(mapCorpToLocal(c));
        if(r === "created") created++; else updated++;
      });
      return { total: arr.length, created: created, updated: updated };
    });
  }

  return { sync: sync, mapCorpToLocal: mapCorpToLocal };
})();

const DeadlineService=S.services.DeadlineService=(()=>{
  const holidays=new Set(C.HOLIDAYS_2026);
  const isHoliday=(iso)=>holidays.has(iso.slice(0,10));
  const isWeekend=(d)=>{const g=d.getUTCDay();return g===0||g===6;};
  const isBusinessDay=(d)=>!isWeekend(d)&&!isHoliday(d.toISOString());
  const toDate=(iso)=>new Date(iso.slice(0,10)+"T00:00:00Z");
  const addBusinessDays=(iso,n)=>{let d=toDate(iso),c=0;if(n<=0)return iso.slice(0,10);
    while(c<n){d.setUTCDate(d.getUTCDate()+1);if(isBusinessDay(d))c++;}return d.toISOString().slice(0,10);};
  const countBusinessDays=(a,b)=>{let d=toDate(a),end=toDate(b),c=0;while(d<end){d.setUTCDate(d.getUTCDate()+1);if(isBusinessDay(d))c++;}return c;};
  const getRemainingBusinessDays=(due)=>{if(!due)return null;const t=U.todayISO();return t<=due?countBusinessDays(t,due):-countBusinessDays(due,t);};
  const isOverdue=(due,done)=>!done&&!!due&&due<U.todayISO();
  const isNearDeadline=(due,done)=>{if(done||!due)return false;const r=getRemainingBusinessDays(due);return r!=null&&r>=0&&r<=1;};
  const slaLabel=(due,done,doneDate)=>{
    if(done){if(due&&doneDate&&doneDate>due)return{t:"Concluído com atraso",c:"b-amber"};return{t:"Concluído no prazo",c:"b-green"};}
    if(!due)return{t:"Sem prazo",c:"b-gray"};const r=getRemainingBusinessDays(due);
    if(r<0)return{t:"Atrasado",c:"b-red"};if(r===0)return{t:"Vence hoje",c:"b-orange"};
    if(r<=1)return{t:"Próximo do prazo",c:"b-amber"};return{t:"Dentro do prazo",c:"b-green"};};
  return{isHoliday,isBusinessDay,addBusinessDays,countBusinessDays,getRemainingBusinessDays,isOverdue,isNearDeadline,slaLabel,
    formatBrazilianDate:F.date,formatBrazilianDateTime:F.dateTime};
})();

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let i=0,field="",row=[],inQuotes=false;
  while(i<text.length){const c=text[i];
    if(inQuotes){if(c==='"'){if(text[i+1]==='"'){field+='"';i+=2;continue;}inQuotes=false;i++;continue;}field+=c;i++;continue;}
    if(c==='"'){inQuotes=true;i++;continue;}
    if(c===";"){row.push(field);field="";i++;continue;}
    if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(field);field="";rows.push(row);row=[];i++;continue;}
    field+=c;i++;}
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}

S.services.FilterService=(()=>{
  const stageOf=(c)=>c.workflow.currentStage;
  const curStage=(c)=>c.workflow.stages.find(s=>s.name===c.workflow.currentStage)||c.workflow.stages[0];
  const dueOf=(c)=>curStage(c).dueDate;
  const getClaimsByCurrentStage=(name)=>R.ClaimRepository.all().filter(c=>stageOf(c)===name);
  const getClaimsPendingInspection=(extra={})=>{const pending=["Solicitada","Aguardando agendamento","Agendada","Pendente de realização"];
    let list=R.ClaimRepository.all().filter(c=>c.generalStatus!=="Cancelado"&&pending.includes(c.inspection.situation)&&
      !["Realizada","Concluída","Dispensada","Cancelada"].includes(c.inspection.situation));
    if(extra.insurerId)list=list.filter(c=>c.insurerId===extra.insurerId);
    if(extra.owner)list=list.filter(c=>c.internalOwner===extra.owner);return list;};
  const getOverdueClaims=()=>R.ClaimRepository.all().filter(c=>{const s=curStage(c);
    return c.generalStatus!=="Cancelado"&&c.generalStatus!=="Encerrado"&&DeadlineService.isOverdue(s.dueDate,s.situation==="Concluída");});
  const getClaimsWaitingForCustomer=()=>R.ClaimRepository.all().filter(c=>curStage(c).situation==="Aguardando cliente");
  const getClaimsWaitingForInsurer=()=>R.ClaimRepository.all().filter(c=>curStage(c).situation==="Aguardando seguradora");
  const getClaimsWaitingForParts=()=>R.ClaimRepository.all().filter(c=>curStage(c).situation==="Aguardando peças"||stageOf(c)==="Aguardando peças");
  const getClaimsWithoutRecentUpdates=(days=7)=>R.ClaimRepository.all().filter(c=>c.generalStatus!=="Encerrado"&&c.generalStatus!=="Cancelado"&&U.daysBetween(c.lastUpdate,U.todayISO())>=days);
  const getClaimStageMetrics=()=>{const m={};R.ClaimRepository.all().forEach(c=>{const s=stageOf(c);m[s]=(m[s]||0)+1;});return m;};
  const applyQuick=(list,q)=>{switch(q){
    case"open":return list.filter(c=>["Aberto","Em andamento"].includes(c.generalStatus));
    case"docs":return list.filter(c=>stageOf(c)==="Coleta de documentos");
    case"pendingOpen":return list.filter(c=>stageOf(c)==="Abertura na seguradora");
    case"pendingInspection":return getClaimsPendingInspection();
    case"analysis":return list.filter(c=>stageOf(c)==="Análise técnica");
    case"waitingAuth":return list.filter(c=>stageOf(c)==="Autorização de reparos");
    case"waitingParts":return getClaimsWaitingForParts();
    case"repair":return list.filter(c=>stageOf(c)==="Execução de reparos");
    case"delivery":return list.filter(c=>stageOf(c)==="Entrega do veículo");
    case"indemnity":return list.filter(c=>["Kit de documentos","Regularização de pendências","Transferência do veículo","Análise final","Pagamento da indenização"].includes(stageOf(c))&&c.generalStatus!=="Encerrado");
    case"waitingCustomer":return getClaimsWaitingForCustomer();
    case"waitingInsurer":return getClaimsWaitingForInsurer();
    case"near":return list.filter(c=>DeadlineService.isNearDeadline(dueOf(c),curStage(c).situation==="Concluída"));
    case"overdue":return getOverdueClaims();
    case"stale":return getClaimsWithoutRecentUpdates();
    case"concluded":return list.filter(c=>c.generalStatus==="Encerrado");
    default:return list;}};
  const filterClaims=(f={})=>{let list=R.ClaimRepository.all();
    if(f.q){const q=f.q.toLowerCase();list=list.filter(c=>(c.protocol+" "+c.insurerClaimNo+" "+c.vehicle+" "+c.plate+" "+clientName(c.clientId)).toLowerCase().includes(q));}
    if(f.stage)list=list.filter(c=>stageOf(c)===f.stage);
    if(f.situation)list=list.filter(c=>curStage(c).situation===f.situation);
    if(f.status)list=list.filter(c=>c.generalStatus===f.status);
    if(f.branch)list=list.filter(c=>c.workflow.branch===f.branch);
    if(f.insurerId)list=list.filter(c=>c.insurerId===f.insurerId);
    if(f.owner)list=list.filter(c=>c.internalOwner===f.owner);
    if(f.nextResp)list=list.filter(c=>curStage(c).resp===f.nextResp);
    if(f.quick)list=applyQuick(list,f.quick);return list;};
  return{filterClaims,getClaimsByCurrentStage,getClaimsPendingInspection,getOverdueClaims,getClaimsWaitingForCustomer,
    getClaimsWaitingForInsurer,getClaimsWaitingForParts,getClaimsWithoutRecentUpdates,getClaimStageMetrics,curStage,dueOf,stageOf};
})();

S.services.WorkflowService=(()=>{
  const stageList=(branch)=>{const T=S.data.workflowTemplate;let l=[...T.common];
    if(branch==="Perda parcial/reparos")l=l.concat(T.repair);else if(branch==="Perda total/indenização")l=l.concat(T.indemnity);return l;};
  const createWorkflowInstance=(branch="Ainda não definido")=>{const T=S.data.workflowTemplate;const list=stageList(branch);let cursor=U.todayISO();
    const stages=list.map((def,i)=>{const min=DeadlineService.addBusinessDays(cursor,def.minDays);const due=DeadlineService.addBusinessDays(cursor,def.maxDays);
      const st={name:def.name,order:i+1,situation:i===0?"Em andamento":"Não iniciada",resp:def.defaultResp,startDate:i===0?U.todayISO():null,minDate:min,dueDate:due,originalDueDate:due,doneDate:null,blockers:[]};cursor=due;return st;});
    return{modelId:T.modelId,version:T.version,branch,currentStage:list[0].name,stages};};
  const findStage=(claim,name)=>claim.workflow.stages.find(s=>s.name===name);
  const validateTransition=(claim,stageName)=>{return true;};
  const advanceStage=(claim)=>{const stages=claim.workflow.stages;
    const next=stages.find(s=>s.situation!=="Concluída"&&s.situation!=="Dispensada"&&s.situation!=="Cancelada");
    if(next){claim.workflow.currentStage=next.name;if(next.situation==="Não iniciada"){next.situation="Em andamento";next.startDate=U.todayISO();}}
    else{claim.generalStatus="Encerrado";addTimeline(claim,"Encerramento","Todas as etapas foram concluídas.");}return claim;};
  const completeStage=(claim,stageName,reason)=>{P.require("claim");const st=findStage(claim,stageName);if(!st)throw new Error("Etapa não encontrada.");
    if(stageName==="Abertura na seguradora"&&!claim.insurerClaimNo&&!reason)throw new Error("Informe o número do sinistro na seguradora ou uma justificativa para concluir a abertura.");
    const old=st.situation;st.situation="Concluída";st.doneDate=U.todayISO();
    addAudit(claim,"Etapa concluída","situacao("+stageName+")",old,"Concluída",reason);addTimeline(claim,"Etapa","Etapa concluída: "+stageName+".");advanceStage(claim);return claim;};
  const reopenStage=(claim,stageName,reason)=>{P.require("claim");if(!reason)throw new Error("Justificativa obrigatória para reabrir etapa.");
    const st=findStage(claim,stageName);if(!st)throw new Error("Etapa não encontrada.");const old=st.situation;st.situation="Em andamento";st.doneDate=null;claim.workflow.currentStage=stageName;
    if(claim.generalStatus==="Encerrado")claim.generalStatus="Em andamento";
    addAudit(claim,"Etapa reaberta","situacao("+stageName+")",old,"Em andamento",reason);addTimeline(claim,"Etapa","Etapa reaberta: "+stageName+".");return claim;};
  const waiveStage=(claim,stageName,reason)=>{P.require("claim");if(!reason)throw new Error("Justificativa obrigatória para dispensar etapa.");
    const st=findStage(claim,stageName);const old=st.situation;st.situation="Dispensada";addAudit(claim,"Etapa dispensada",stageName,old,"Dispensada",reason);addTimeline(claim,"Etapa","Etapa dispensada: "+stageName+".");advanceStage(claim);return claim;};
  const cancelStage=(claim,stageName,reason)=>{P.require("claim");if(!reason)throw new Error("Justificativa obrigatória.");
    const st=findStage(claim,stageName);const old=st.situation;st.situation="Cancelada";addAudit(claim,"Etapa cancelada",stageName,old,"Cancelada",reason);addTimeline(claim,"Etapa","Etapa cancelada: "+stageName+".");return claim;};
  const setSituation=(claim,stageName,sit,reason)=>{P.require("claim");const st=findStage(claim,stageName);const old=st.situation;st.situation=sit;
    addAudit(claim,"Mudança de situação",stageName,old,sit,reason);addTimeline(claim,"Situação",stageName+" → "+sit+".");return claim;};
  const defineBranch=(claim,branch,reason)=>{P.require("claim");if(!reason)throw new Error("Justificativa obrigatória para definir o caminho.");
    const old=claim.workflow.branch;claim.workflow.branch=branch;
    claim.branchDecision={branch,by:S.state.session.id,byName:S.state.session.name,at:U.todayISO(),reason};
    const extra=branch==="Perda parcial/reparos"?S.data.workflowTemplate.repair:(branch==="Perda total/indenização"?S.data.workflowTemplate.indemnity:[]);let cursor=U.todayISO();
    extra.forEach(def=>{if(!findStage(claim,def.name)){const due=DeadlineService.addBusinessDays(cursor,def.maxDays);
      claim.workflow.stages.push({name:def.name,order:claim.workflow.stages.length+1,situation:"Não iniciada",resp:def.defaultResp,startDate:null,minDate:DeadlineService.addBusinessDays(cursor,def.minDays),dueDate:due,originalDueDate:due,doneDate:null,blockers:[]});cursor=due;}});
    addAudit(claim,"Definição do caminho","caminho",old,branch,reason);addTimeline(claim,"Caminho","Caminho definido: "+branch+".");return claim;};
  const changeBranch=(claim,branch,reason)=>defineBranch(claim,branch,reason);
  const undoBranch=(claim,reason)=>{P.require("claim");if(!claim.branchDecision)throw new Error("Nenhum caminho definido para desfazer.");if(!reason)throw new Error("Justificativa obrigatória para desfazer o caminho.");
    const branch=claim.branchDecision.branch;
    const extra=branch==="Perda parcial/reparos"?S.data.workflowTemplate.repair:(branch==="Perda total/indenização"?S.data.workflowTemplate.indemnity:[]);
    const extraNames=extra.map(e=>e.name);
    const touched=claim.workflow.stages.filter(s=>extraNames.includes(s.name)&&s.situation!=="Não iniciada");
    if(touched.length)throw new Error("Não é possível desfazer: a(s) etapa(s) "+touched.map(s=>s.name).join(", ")+" já tiveram andamento.");
    claim.workflow.stages=claim.workflow.stages.filter(s=>!extraNames.includes(s.name));
    const old=claim.workflow.branch;claim.workflow.branch="Ainda não definido";claim.branchDecision=null;
    addAudit(claim,"Caminho desfeito","caminho",old,"Ainda não definido",reason);addTimeline(claim,"Caminho","Definição de caminho desfeita ("+old+").");return claim;};
  const changeDeadline=(claim,stageName,newDue,reason)=>{P.require("claim");if(!reason)throw new Error("Justificativa obrigatória para alterar prazo.");
    const st=findStage(claim,stageName);const old=st.dueDate;if(!st.originalDueDate)st.originalDueDate=old;st.dueDate=newDue;
    addAudit(claim,"Alteração de prazo",stageName,old,newDue,reason);addTimeline(claim,"Prazo","Prazo de "+stageName+" alterado de "+F.date(old)+" para "+F.date(newDue)+".");return claim;};
  const addBlocker=(claim,blocker)=>{P.require("claim");blocker.id=U.uid("bk");blocker.situation="Aberto";blocker.startDate=U.todayISO();
    (claim.blockers=claim.blockers||[]).push(blocker);addAudit(claim,"Impedimento criado","bloqueio","—",blocker.category,blocker.description);addTimeline(claim,"Impedimento","Impedimento registrado: "+blocker.category+".");return claim;};
  const removeBlocker=(claim,id,reason)=>{P.require("claim");const b=(claim.blockers||[]).find(x=>x.id===id);if(b){b.situation="Resolvido";b.doneDate=U.todayISO();}
    addAudit(claim,"Impedimento removido","bloqueio",b?b.category:"—","Resolvido",reason);addTimeline(claim,"Impedimento","Impedimento resolvido.");return claim;};
  const registerFollowUp=(claim,comm)=>{P.require("claim");comm.id=U.uid("cm");comm.at=U.nowISO();comm.userId=S.state.session.id;
    claim.communications.unshift(comm);addTimeline(claim,"Follow-up","Cobrança registrada com "+comm.target+".");addAudit(claim,"Follow-up registrado","comunicação","—",comm.target,comm.summary||"");return claim;};
  const cancelClaim=(claim,reason)=>{P.require("claim");if(!reason)throw new Error("Justificativa obrigatória.");
    const old=claim.generalStatus;claim.generalStatus="Cancelado";claim.workflow.branch="Cancelado";addAudit(claim,"Cancelamento","status",old,"Cancelado",reason);addTimeline(claim,"Cancelamento","Sinistro cancelado.");return claim;};
  const calculateNextStage=(claim)=>{const st=FS.curStage(claim);return st?st.name:null;};
  const calculateSla=(claim)=>{const st=FS.curStage(claim);return DeadlineService.slaLabel(st.dueDate,st.situation==="Concluída",st.doneDate);};
  const identifyPendingItems=(claim)=>claim.documents.filter(d=>!["Aprovado","Dispensado"].includes(d.situation)).map(d=>d.type);
  return{createWorkflowInstance,completeStage,advanceStage,reopenStage,waiveStage,cancelStage,setSituation,defineBranch,changeBranch,undoBranch,
    changeDeadline,addBlocker,removeBlocker,registerFollowUp,cancelClaim,validateTransition,stageList,findStage,calculateNextStage,calculateSla,identifyPendingItems};
})();

S.tests=(()=>{const results=[];let beforeFn=null;

  function beforeEach(fn){beforeFn=fn;}
  function test(name,fn){if(beforeFn)beforeFn();const t0=performance.now();try{fn();results.push({name,pass:true,ms:performance.now()-t0});}catch(e){results.push({name,pass:false,err:e.message,ms:performance.now()-t0});}}

  function assertEqual(a,b,msg){if(a!==b)throw new Error((msg||"")+" esperado "+JSON.stringify(b)+", obtido "+JSON.stringify(a));}
  function assertDeepEqual(a,b,msg){if(JSON.stringify(a)!==JSON.stringify(b))throw new Error(msg||"objetos diferentes");}

    return{id:U.uid("t"),protocol:"T-1",insurerClaimNo:"",clientId:"cli1",vehicle:"Teste",plate:"TST1234",insurerId:"ins1",policyId:"pol1",generalStatus:"Aberto",workflow:wf,

      test("isHoliday detecta feriado",()=>{assert(DeadlineService.isHoliday("2026-01-01"));});
      test("isOverdue funciona",()=>{assert(DeadlineService.isOverdue("2020-01-01",false));assert(!DeadlineService.isOverdue("2020-01-01",true));});
    });

      test("alterar prazo preserva original",()=>{const c=makeClaim();const st=WF.findStage(c,"Comunicação");const orig=st.originalDueDate;WF.changeDeadline(c,"Comunicação","2026-12-31","Ajuste");assertEqual(WF.findStage(c,"Comunicação").originalDueDate,orig);assertEqual(WF.findStage(c,"Comunicação").dueDate,"2026-12-31");});
      test("impedimento cria e remove",()=>{const c=makeClaim();WF.addBlocker(c,{category:"Backorder",description:"peça",resp:"Fornecedor de peças"});assertEqual(c.blockers.length,1);WF.removeBlocker(c,c.blockers[0].id,"resolvido");assertEqual(c.blockers[0].situation,"Resolvido");});
    });
    describe("Filtro de vistoria pendente",()=>{
      test("regras de inclusão/exclusão",()=>{const orig=R.ClaimRepository.all;const fake=[
        {id:"a",generalStatus:"Em andamento",inspection:{situation:"Agendada"},insurerId:"ins1",internalOwner:"X",workflow:{currentStage:"Vistoria de danos",stages:[]}},
        {id:"b",generalStatus:"Em andamento",inspection:{situation:"Realizada"},insurerId:"ins1",internalOwner:"X",workflow:{currentStage:"Vistoria de danos",stages:[]}},
        {id:"c",generalStatus:"Cancelado",inspection:{situation:"Agendada"},insurerId:"ins1",internalOwner:"X",workflow:{currentStage:"Vistoria de danos",stages:[]}},
        {id:"d",generalStatus:"Em andamento",inspection:{situation:"Dispensada"},insurerId:"ins2",internalOwner:"Y",workflow:{currentStage:"Vistoria de danos",stages:[]}}];
        R.ClaimRepository.all=()=>fake;try{const res=FS.getClaimsPendingInspection();const ids=res.map(x=>x.id);
          assert(ids.includes("a"),"agendada não realizada deve aparecer");assert(!ids.includes("b"),"realizada não deve aparecer");
          assert(!ids.includes("c"),"cancelado não deve aparecer");assert(!ids.includes("d"),"dispensada não deve aparecer");
          assertEqual(FS.getClaimsPendingInspection({insurerId:"ins1"}).length,1,"combinação seguradora");

      test("migração mantém schemaVersion",()=>{const m=migrate({claims:[]});assertEqual(m.schemaVersion,1);});
    });
    describe("Permissões",()=>{
      test("Consulta não pode alterar claim",()=>{S.state.session={id:"u4",name:"Carlos",role:C.ROLES.VIEWER};assert(!P.can("claim"));assert(P.can("view"));S.state.session={id:"u1",name:"Marina",role:C.ROLES.ADMIN};assert(P.can("claim"));});
    });
    describe("Integrado (fluxo ponta a ponta)",()=>{
      test("login→criar→abrir→vistoria→análise→caminho→reabrir",()=>{
        const c=makeClaim();assert(c.workflow.stages.length===7);
        WF.completeStage(c,"Comunicação","");c.documents[0].situation="Aprovado";WF.completeStage(c,"Coleta de documentos","");
        c.insurerClaimNo="SEG-1";WF.completeStage(c,"Abertura na seguradora","");assertEqual(c.workflow.currentStage,"Vistoria de danos");
        c.inspection.situation="Realizada";WF.completeStage(c,"Vistoria de danos","");WF.completeStage(c,"Análise técnica","");
        WF.defineBranch(c,"Perda total/indenização","Perda total confirmada");assert(c.workflow.stages.some(s=>s.name==="Pagamento da indenização"));
        WF.reopenStage(c,"Vistoria de danos","Necessária revistoria");assertEqual(c.workflow.currentStage,"Vistoria de danos");
        assert(c.audit.length>0,"auditoria registrada");assert(c.timeline.length>0,"timeline registrada");});
    });
    S.state.session=prevSession;
    const pass=results.filter(r=>r.name&&r.pass).length,fail=results.filter(r=>r.name&&!r.pass).length;
    try{Store.set(S.config.keys.tests,JSON.stringify({pass,fail,at:U.nowISO()}));}catch(e){}
    return{results:results.slice(),pass,fail};}

  db();/* inicializa + migra + valida */
  loadSession();
  window.addEventListener("hashchange",()=>{const shell=document.querySelector(".shell");if(shell)shell.classList.remove("mobile-open");Router.render();});
  if(!location.hash)location.hash=S.state.session?"#/dashboard":"#/login";
  Router.render();
}catch(e){
  document.getElementById("app").innerHTML="";
  document.getElementById("app").appendChild(U.el("div",{style:"max-width:520px;margin:60px auto;padding:24px"},[
    U.el("div",{class:"card"},[U.el("h1",{text:"Erro ao iniciar"}),
      U.el("p",{class:"page-sub",text:"Ocorreu um problema ao carregar o Sinistro360. Você pode restaurar os dados de demonstração."}),
      U.el("p",{class:"mono",text:String(e.message)}),
      U.el("button",{class:"btn",onclick:()=>{try{R.restoreDemo();}catch(_){}location.hash="#/login";location.reload();}},["Restaurar dados e recarregar"])])]));
}}
document.addEventListener("DOMContentLoaded",init);
if(document.readyState!=="loading")init();
</script>
</html>
