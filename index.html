<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de Sinistros — CorpNuvem</title>
<style>
  :root{--azul:#1c5f9e;--azul-claro:#dce9f5;--borda:#8fa9c4;--painel:#e8eef4;
        --cinza:#f0f0f0;--label:#3a6ea5;--manual:#c47f16;--manual-bg:#fff8e8}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;font-size:13px;background:#c9d6e3;color:#1a1a1a}
  button{font-family:inherit;font-size:12px;cursor:pointer}
  input,select,textarea{font-family:inherit}

  #login{position:fixed;inset:0;background:#5f7a96;display:flex;align-items:center;justify-content:center;z-index:100}
  #login .box{background:#fff;border:1px solid var(--borda);border-radius:4px;padding:26px 30px;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  #login h1{margin:0 0 4px;font-size:18px;color:var(--azul)}
  #login p.sub{margin:0 0 18px;font-size:11px;color:#666}
  #login label{display:block;margin:10px 0 3px;font-size:11px;color:var(--label);font-weight:600}
  #login input{width:100%;padding:6px 8px;border:1px solid var(--borda);border-radius:2px;font-size:13px}
  #login button{width:100%;margin-top:18px;padding:9px;background:var(--azul);color:#fff;border:none;border-radius:2px;font-size:13px;font-weight:600}
  .erro{color:#b00020;font-size:11px;margin-top:10px;min-height:14px;line-height:1.4}

  #app{display:none;height:100vh;flex-direction:column}
  .titlebar{background:linear-gradient(#fdfdfd,#eef2f6);border-bottom:1px solid var(--borda);padding:6px 12px;display:flex;align-items:center;gap:8px}
  .titlebar .ico{width:16px;height:16px;background:var(--azul);border-radius:2px}
  .titlebar .spacer{flex:1}
  .titlebar .user{font-size:11px;color:#555}
  .titlebar button{background:#fff;border:1px solid var(--borda);padding:3px 10px;border-radius:2px}

  .filtros{background:var(--painel);border-bottom:1px solid var(--borda);padding:10px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .campo{display:flex;flex-direction:column;gap:3px}
  .campo label{font-size:10px;color:var(--label);font-weight:600;text-transform:uppercase}
  .campo input,.campo select{padding:4px 6px;border:1px solid var(--borda);border-radius:2px;font-size:12px;background:#fff;min-width:120px}
  .btn-buscar{background:var(--azul);color:#fff;border:none;padding:6px 22px;border-radius:2px;font-weight:600}
  .btn-limpar{background:#fff;border:1px solid var(--borda);padding:6px 14px;border-radius:2px}

  .corpo{flex:1;display:flex;min-height:0}
  .lista{width:40%;min-width:360px;border-right:1px solid var(--borda);background:#fff;display:flex;flex-direction:column}
  .lista .head{padding:6px 10px;background:var(--cinza);border-bottom:1px solid var(--borda);font-size:11px}
  .lista .rolagem{flex:1;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{position:sticky;top:0;background:var(--cinza);border-bottom:1px solid var(--borda);padding:6px 8px;text-align:left;font-size:11px;white-space:nowrap}
  td{padding:5px 8px;border-bottom:1px solid #eaeaea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f2f7fc}
  tbody tr.sel{background:var(--azul);color:#fff}
  .marca{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--manual);margin-left:5px}
  .vazio{padding:40px 20px;text-align:center;color:#888}
  .paginacao{padding:6px 10px;background:var(--cinza);border-top:1px solid var(--borda);display:flex;gap:6px;justify-content:center;align-items:center;font-size:11px}
  .paginacao button{border:1px solid var(--borda);background:#fff;padding:3px 10px;border-radius:2px}
  .paginacao button:disabled{opacity:.4;cursor:default}

  .detalhe{flex:1;display:flex;flex-direction:column;background:var(--painel);min-width:0}
  .det-head{background:#fff;border-bottom:1px solid var(--borda);padding:8px 14px;display:flex;justify-content:space-between;gap:12px}
  .det-head .cli{font-style:italic;font-weight:700;color:var(--azul);font-size:14px}
  .det-head .sit{font-size:17px;font-weight:700;color:#7a7a7a;text-transform:uppercase;text-align:right}
  .abas{display:flex;gap:2px;padding:6px 12px 0;background:#fff;border-bottom:1px solid var(--borda);flex-wrap:wrap}
  .aba{padding:6px 16px;border:1px solid var(--borda);border-bottom:none;border-radius:4px 4px 0 0;background:var(--cinza);font-size:12px;position:relative;top:1px;cursor:pointer}
  .aba.on{background:#fff;font-weight:600;border-bottom:1px solid #fff}
  .aba .badge{background:var(--azul);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:5px}
  .conteudo{flex:1;overflow:auto;padding:14px}
  .painel-form{background:#fff;border:1px solid var(--borda);border-radius:3px;padding:14px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 16px}
  .ro label{display:block;font-size:10px;color:var(--label);font-weight:600;margin-bottom:2px}
  .ro .v{border:1px solid var(--borda);background:#fafafa;padding:5px 7px;border-radius:2px;min-height:28px;font-size:12px;word-break:break-word;cursor:text;position:relative}
  .ro .v:hover{background:#f2f7fc}
  .ro .v.editado{background:var(--manual-bg);border-color:var(--manual)}
  .ro .v input,.ro .v textarea{width:100%;border:none;background:transparent;font-size:12px;outline:none;resize:vertical}
  .ro .acoes{float:right;font-size:10px;color:var(--manual);cursor:pointer;margin-left:6px}
  .divergencia{font-size:10px;color:#b00020;margin-top:3px;line-height:1.4}
  .divergencia a{color:var(--azul);cursor:pointer;text-decoration:underline}
  .secao{font-size:11px;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;padding-bottom:4px;border-bottom:1px solid var(--azul-claro);display:flex;justify-content:space-between;align-items:center}
  .secao button{background:var(--azul);color:#fff;border:none;padding:3px 10px;border-radius:2px;font-size:11px;text-transform:none;letter-spacing:0}
  pre.json{background:#1e1e1e;color:#d4d4d4;padding:12px;border-radius:3px;font-size:11px;overflow:auto;max-height:60vh}
  .placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:#8195a8}
  .carregando{padding:30px;text-align:center;color:#666}
  .aviso{background:var(--manual-bg);border:1px solid #e0cf8a;border-radius:3px;padding:8px 12px;font-size:11px;line-height:1.6;margin-bottom:12px}

  /* ---------- LINHA DO TEMPO (ETAPAS) ---------- */
  .etapas{position:relative;padding-left:6px}
  .etapa{display:flex;gap:14px;position:relative;padding-bottom:18px}
  .etapa:last-child{padding-bottom:0}
  .etapa .trilho{position:relative;width:22px;flex:none;display:flex;justify-content:center}
  .etapa .bola{width:20px;height:20px;border-radius:50%;background:#cfd8e0;margin-top:2px;z-index:2;
               display:flex;align-items:center;justify-content:center}
  .etapa .bola i{width:8px;height:8px;border-radius:50%;background:#fff;display:none}
  .etapa.andamento .bola{background:var(--azul)} .etapa.andamento .bola i{display:block}
  .etapa.concluido .bola{background:#2e8b45} .etapa.concluido .bola i{display:block}
  .etapa.na .bola{background:#b9b9b9}
  .etapa:not(:last-child) .trilho::after{content:'';position:absolute;top:24px;bottom:-20px;width:2px;background:#d5dde4;z-index:1}
  .etapa .txt{flex:1;min-width:0}
  .etapa .tit{font-weight:700;font-size:13px}
  .etapa .sub{color:#7b8794;font-size:12px;line-height:1.5}
  .etapa .sub b{color:#5a6672;font-weight:600}
  .etapa .ferr{opacity:0;display:flex;gap:4px;align-self:flex-start}
  .etapa:hover .ferr{opacity:1}
  .etapa .ferr button{border:1px solid var(--borda);background:#fff;border-radius:2px;padding:1px 6px;font-size:11px}
  .form-etapa{margin-top:8px;background:#fbfcfd;border:1px solid var(--borda);border-radius:3px;padding:10px;
              display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px}
  .form-etapa .full{grid-column:1/-1}
  .form-etapa label{display:block;font-size:10px;color:var(--label);font-weight:600;margin-bottom:2px}
  .form-etapa input,.form-etapa select,.form-etapa textarea{width:100%;padding:4px 6px;border:1px solid var(--borda);border-radius:2px;font-size:12px}

  .hist{display:flex;gap:12px;min-height:380px}
  .hist-lista{width:230px;background:#fff;border:1px solid var(--borda);border-radius:3px;display:flex;flex-direction:column}
  .hist-lista .cab{display:flex;background:var(--cinza);border-bottom:1px solid var(--borda);font-size:11px;font-weight:600;padding:5px 8px}
  .hist-lista .cab span:first-child{flex:1}
  .hist-lista .rol{flex:1;overflow:auto}
  .hist-item{display:flex;padding:5px 8px;font-size:12px;cursor:pointer;border-bottom:1px solid #f2f2f2}
  .hist-item span:first-child{flex:1}
  .hist-item.on{background:var(--azul);color:#fff}
  .hist-item.man{border-left:3px solid var(--manual)}
  .hist-det{flex:1;background:#fff;border:1px solid var(--borda);border-radius:3px;padding:14px;min-width:0}
  .hist-topo{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  .hist-desc{border:1px solid var(--borda);border-radius:3px;padding:10px;background:#fdfdfd;white-space:pre-wrap;min-height:150px;font-size:12px;line-height:1.55}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Consulta de Sinistros</h1>
    <p class="sub">Consulta via API · anotações manuais locais</p>
    <label>Servidor</label><input id="lg-url" value="https://api.corpnuvem.com">
    <label>E-mail</label><input id="lg-email" type="email" autocomplete="username">
    <label>Senha</label><input id="lg-senha" type="password" autocomplete="current-password">
    <button id="lg-btn">Entrar</button>
    <div class="erro" id="lg-erro"></div>
  </div>
</div>

<div id="app">
  <div class="titlebar">
    <div class="ico"></div><strong style="font-size:12px">Controle de Sinistros</strong>
    <div class="spacer"></div>
    <span class="user" id="tb-user"></span>
    <button id="tb-exportar">Backup ↓</button>
    <button id="tb-importar">Restaurar ↑</button>
    <input type="file" id="tb-arquivo" accept="application/json" style="display:none">
    <button id="tb-sair">Sair</button>
  </div>

  <div class="filtros">
    <div class="campo"><label>Tipo</label>
      <select id="f-tipo"><option value="S">Sinistro</option><option value="A">Aviso</option><option value="T">Terceiro</option></select></div>
    <div class="campo"><label>Período por</label>
      <select id="f-tipodata"><option value="OCO">Ocorrência</option><option value="AVI">Aviso</option><option value="ENC">Encerramento</option><option value="MOD">Modificação</option></select></div>
    <div class="campo"><label>Data inicial</label><input id="f-ini" type="date"></div>
    <div class="campo"><label>Data final</label><input id="f-fim" type="date"></div>
    <div class="campo"><label>Situação</label>
      <select id="f-situacao"><option value="T">Todas</option><option value="P">Pendente</option><option value="A">Em andamento</option><option value="I">Indenizado</option><option value="E">Encerrado sem indenização</option></select></div>
    <div class="campo"><label>Por página</label>
      <select id="f-qtd"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></div>
    <div class="campo"><label>Filtrar na tela</label><input id="f-texto" placeholder="nº, placa, segurado..."></div>
    <button class="btn-buscar" id="f-btn">Sincronizar</button>
    <button class="btn-limpar" id="f-reset">Limpar</button>
  </div>

  <div class="corpo">
    <div class="lista">
      <div class="head" id="ls-info">Nenhuma consulta realizada</div>
      <div class="rolagem" id="ls-rolagem"><div class="vazio">Defina o período e clique em <b>Sincronizar</b>.</div></div>
      <div class="paginacao"><button id="pg-ant">◀</button><span id="pg-num">Página 1</span><button id="pg-prox">▶</button></div>
    </div>

    <div class="detalhe">
      <div class="det-head">
        <div><div class="cli" id="d-cliente">—</div><div style="font-size:11px;color:#666" id="d-sub"></div></div>
        <div class="sit" id="d-situacao"></div>
      </div>
      <div class="abas">
        <div class="aba on" data-aba="sinistro">Sinistro</div>
        <div class="aba" data-aba="etapas">Etapas<span class="badge" id="bd-etapas" style="display:none"></span></div>
        <div class="aba" data-aba="historico">Histórico<span class="badge" id="bd-hist" style="display:none"></span></div>
        <div class="aba" data-aba="notas">Anotações</div>
        <div class="aba" data-aba="anexos">Anexos</div>
        <div class="aba" data-aba="json">JSON</div>
      </div>
      <div class="conteudo" id="d-conteudo"><div class="placeholder">Selecione um sinistro na lista ao lado.</div></div>
    </div>
  </div>
</div>

<script>
/* ==================================================================
   1. API  (camada volátil — sempre substituída na sincronização)
   ================================================================== */
const Api = {
  base:'', token:'', email:'',
  async login(base,email,senha){
    this.base=base.replace(/\/+$/,'');
    const r=await fetch(this.base+'/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,senha,aplicacao:0})});
    const txt=await r.text(); let d={}; try{d=JSON.parse(txt);}catch(e){}
    if(!r.ok) throw new Error(d.message||('HTTP '+r.status+' — '+txt.slice(0,160)));
    const t=d.token||d.token_auth||d.access_token||d.jwt||(d.data&&(d.data.token||d.data.token_auth));
    if(!t) throw new Error('Token não reconhecido: '+txt.slice(0,160));
    this.token=String(t); this.email=email;
    sessionStorage.setItem('cn_sess',JSON.stringify({base:this.base,token:this.token,email}));
  },
  restaurar(){ try{const s=JSON.parse(sessionStorage.getItem('cn_sess')||'null');
    if(s&&s.token){Object.assign(this,s);return true;}}catch(e){} return false; },
  sair(){ sessionStorage.removeItem('cn_sess'); this.token=''; },
  headers(){ return {'Authorization':this.token,'Content-Type':'application/json'}; },
  async get(caminho){
    const r=await fetch(this.base+caminho,{headers:this.headers()});
    const txt=await r.text(); let d=null; try{d=JSON.parse(txt);}catch(e){}
    return {status:r.status,ok:r.ok,dados:d,texto:txt};
  },
  async sinistros(p){
    const qs=new URLSearchParams({tipo_sinistro:p.tipo,data_inicial:p.ini,data_final:p.fim,
      tipo_data:p.tipoData,situacao:p.situacao,qtd_pag:p.qtd,pagina:p.pagina});
    const r=await this.get('/sinistros?'+qs);
    if(r.status===401||r.status===403) throw new Error('SESSAO_EXPIRADA');
    if(r.status===404) return {itens:[],total:0,msg:(r.dados&&r.dados.message)||'Nenhum registro encontrado.'};
    if(!r.ok) throw new Error((r.dados&&r.dados.message)||('HTTP '+r.status));
    const d=r.dados||{};
    const itens=d.sinistros||d.sinistro||d.dados||d.data||(Array.isArray(d)?d:[]);
    return {itens,total:(d.header&&(d.header.count??d.header.total))??itens.length,bruto:d};
  }
};

/* ==================================================================
   2. LOCAL — camada permanente. A sincronização NUNCA escreve aqui.
   ================================================================== */
const ETAPAS_PADRAO = [
  {titulo:'Vistoria',            descricao:'Vistoria do veículo'},
  {titulo:'Análise / atendimento', descricao:''},
  {titulo:'Liberação',           descricao:'Liberação do processo'},
  {titulo:'Encerramento',        descricao:''}
];
const STATUS_ETAPA = ['','Pendente','Em andamento','Concluído','Não se aplica'];

const Local = {
  KEY:'cn_manual_v1',
  todos(){ try{ return JSON.parse(localStorage.getItem(this.KEY)||'{}'); }catch(e){ return {}; } },
  gravaTudo(o){ localStorage.setItem(this.KEY, JSON.stringify(o)); },
  reg(id){ return this.todos()[id] || {campos:{},etapas:null,historico:[],notas:'',extras:[]}; },
  muta(id,fn){
    const t=this.todos();
    const r=t[id]||{campos:{},etapas:null,historico:[],notas:'',extras:[]};
    fn(r); r.alterado=new Date().toLocaleString('pt-BR');
    t[id]=r; this.gravaTudo(t);
  },
  temAlgo(id){
    const r=this.todos()[id]; if(!r) return false;
    return !!(Object.keys(r.campos||{}).length || (r.etapas||[]).some(e=>e.status||e.responsavel||e.data||e.obs)
           || (r.historico||[]).length || (r.notas||'').trim() || (r.extras||[]).length);
  },
  campo(id,ch){ const c=this.reg(id).campos||{}; return c[ch]; },
  setCampo(id,ch,valor,apiAtual){ this.muta(id,r=>{ r.campos=r.campos||{}; r.campos[ch]={v:valor,api:apiAtual}; }); },
  limpaCampo(id,ch){ this.muta(id,r=>{ if(r.campos) delete r.campos[ch]; }); },
  etapas(id){
    const r=this.reg(id);
    if(r.etapas && r.etapas.length) return r.etapas;
    return ETAPAS_PADRAO.map((e,i)=>({id:'e'+i+'_'+Date.now(),titulo:e.titulo,descricao:e.descricao,
      responsavel:'',status:'',data:'',hora:'',obs:''}));
  },
  setEtapas(id,arr){ this.muta(id,r=>{ r.etapas=arr; }); },
  historico(id){ return this.reg(id).historico||[]; },
  addHistorico(id,h){ this.muta(id,r=>{ r.historico=r.historico||[]; r.historico.push(h); }); },
  setHistorico(id,arr){ this.muta(id,r=>{ r.historico=arr; }); },
  notas(id){ return this.reg(id).notas||''; },
  setNotas(id,t){ this.muta(id,r=>{ r.notas=t; }); },
  extras(id){ return this.reg(id).extras||[]; },
  setExtras(id,a){ this.muta(id,r=>{ r.extras=a; }); },
  exportar(){
    const blob=new Blob([JSON.stringify({versao:1,gerado:new Date().toISOString(),dados:this.todos()},null,2)],
      {type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='sinistros-anotacoes-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(a.href);
  },
  importar(texto){
    const j=JSON.parse(texto);
    const novos=j.dados||j;
    const atual=this.todos();
    let n=0;
    for(const k of Object.keys(novos)){ atual[k]=novos[k]; n++; }
    this.gravaTudo(atual); return n;
  }
};

/* ==================================================================
   3. UTILITÁRIOS
   ================================================================== */
const $=s=>document.querySelector(s);
function campo(o,nomes,padrao='—'){
  for(const n of nomes) for(const k of Object.keys(o||{}))
    if(k.toLowerCase()===n.toLowerCase()){ const v=o[k]; if(v!==null&&v!==undefined&&v!=='') return v; }
  return padrao;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function brData(iso){ if(!iso) return ''; const [a,m,d]=iso.split('-'); return `${d}/${m}/${a}`; }
function moeda(v){ const n=Number(String(v).replace(',','.'));
  return isNaN(n)?(v??'—'):n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function ordem(d,h){ const m=String(d||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return (m?+(m[3]+m[2]+m[1]):0)*10000 + (+String(h||'').replace(/\D/g,'').slice(0,4)||0); }
const SITUACAO={P:'PENDENTE',A:'EM ANDAMENTO',I:'INDENIZADO',E:'ENCERRADO SEM IND.',T:'—'};
const Chave={
  cod:s=>campo(s,['codsin','codigo','id','cod_sinistro','nosnum'],''),
  num:s=>campo(s,['numsin','num_sinistro','numero_sinistro'],''),
  filial:s=>campo(s,['codfil','filial'],'1')
};
/* Identificador estável do sinistro — base de todo o armazenamento local */
function idDe(s){ return String(Chave.num(s)||Chave.cod(s)||'').trim(); }
function idSel(){ return Estado.sel? idDe(Estado.sel):''; }

const Estado={itens:[],filtrados:[],pagina:1,sel:null,aba:'sinistro',cacheHist:{},histSel:0,etapaAberta:null};

/* ==================================================================
   4. HISTÓRICO VINDO DA API (mesclado com os manuais)
   ================================================================== */
const Hist={
  template: localStorage.getItem('cn_hist_tpl')||'',
  candidatos:['/atendimentos?codsin={cod}','/atendimento?codsin={cod}','/atendimentos?codigo={cod}&tipo=S',
    '/sinistro_historico?codigo={cod}','/sinistro_historico?codsin={cod}','/historico_sinistro?codigo={cod}',
    '/sinistro_andamento?codigo={cod}','/sinistros/{cod}/historico','/sinistros/{cod}'],
  monta(t,s){ return t.replace('{cod}',encodeURIComponent(Chave.cod(s)))
                      .replace('{num}',encodeURIComponent(Chave.num(s)))
                      .replace('{codfil}',encodeURIComponent(Chave.filial(s))); },
  extrair(raiz){
    let achado=null;
    const parece=a=>Array.isArray(a)&&a.length&&a.every(x=>x&&typeof x==='object')&&
      a.some(x=>{const k=Object.keys(x).map(s=>s.toLowerCase()).join('|');
        return /desc|texto|obs|ocorren|andament|hist/.test(k)&&/dat|hora/.test(k);});
    (function anda(no,p){
      if(achado||p>6||!no||typeof no!=='object') return;
      if(Array.isArray(no)){ if(parece(no)){achado=no;return;} no.forEach(x=>anda(x,p+1)); return; }
      for(const k of Object.keys(no)){ const v=no[k];
        if(Array.isArray(v)&&(/hist|andament|ocorren|atendim/i.test(k)||parece(v))&&v.length&&typeof v[0]==='object'){achado=v;return;}
        anda(v,p+1); if(achado) return; }
    })(raiz,0);
    return achado;
  },
  normaliza(a){ return (a||[]).map(x=>({
    data:campo(x,['data','datinc','dathis','dt'],''), hora:campo(x,['hora','hrhis','horainc'],''),
    referente:campo(x,['referente','referente_ao','tipo','destino'],''),
    descricao:campo(x,['descricao','texto','historico','obs','ocorrencia'],''),
    usuario:campo(x,['usuario','operador','digitador','login'],''), manual:false })); },
  async buscar(s){
    const emb=this.extrair(s);
    if(emb&&emb.length) return {origem:'embutido',itens:this.normaliza(emb)};
    if(!this.template) return {origem:'sem_endpoint',itens:[]};
    const r=await Api.get(this.monta(this.template,s));
    if(r.status===401||r.status===403) throw new Error('SESSAO_EXPIRADA');
    if(!r.ok) return {origem:'erro',itens:[],erro:'HTTP '+r.status};
    const arr=this.extrair(r.dados)||(Array.isArray(r.dados)?r.dados:[]);
    return {origem:this.template,itens:this.normaliza(arr)};
  },
  async descobrir(s,log){
    for(const tpl of this.candidatos){
      const url=this.monta(tpl,s); let r;
      try{ r=await Api.get(url); }catch(e){ log(url,'falha de rede',false); continue; }
      const arr=r.ok?(this.extrair(r.dados)||(Array.isArray(r.dados)?r.dados:null)):null;
      const bom=!!(arr&&arr.length);
      log(url,r.status+(bom?' — '+arr.length+' registro(s)':''),bom);
      if(bom){ this.template=tpl; localStorage.setItem('cn_hist_tpl',tpl); return tpl; }
    }
    return null;
  }
};

/* ==================================================================
   6. SINCRONIZAÇÃO  (só substitui a camada da API)
   ================================================================== */
async function sincronizar(pagina=1){
  const ini=$('#f-ini').value,fim=$('#f-fim').value;
  if(!ini||!fim){ alert('Informe a data inicial e a data final.'); return; }
  Estado.pagina=pagina; Estado.cacheHist={};
  $('#ls-rolagem').innerHTML='<div class="carregando">Sincronizando...</div>';
  try{
    const r=await Api.sinistros({tipo:$('#f-tipo').value,ini:brData(ini),fim:brData(fim),
      tipoData:$('#f-tipodata').value,situacao:$('#f-situacao').value,qtd:$('#f-qtd').value,pagina});
    Estado.itens=r.itens; filtrar();
    $('#ls-info').textContent=r.itens.length? `${r.itens.length} registro(s) · total ${r.total}`
                                            : (r.msg||'Nenhum registro encontrado.');
    /* o registro selecionado é reapontado para o novo objeto da API,
       mas as anotações continuam vindo do Local pelo mesmo id */
    if(Estado.sel){
      const id=idSel();
      const novo=Estado.itens.find(x=>idDe(x)===id);
      if(novo){ Estado.sel=novo; renderDetalhe(); }
    }
  }catch(e){
    if(e.message==='SESSAO_EXPIRADA'){ alert('Sessão expirada.'); Api.sair(); location.reload(); return; }
    $('#ls-rolagem').innerHTML=`<div class="vazio" style="color:#b00020">${esc(e.message)}</div>`;
  }
  $('#pg-num').textContent='Página '+Estado.pagina; $('#pg-ant').disabled=Estado.pagina<=1;
}
function filtrar(){
  const t=$('#f-texto').value.trim().toLowerCase();
  Estado.filtrados=!t?Estado.itens:Estado.itens.filter(o=>JSON.stringify(o).toLowerCase().includes(t));
  renderLista();
}
function renderLista(){
  const box=$('#ls-rolagem');
  if(!Estado.filtrados.length){ box.innerHTML='<div class="vazio">Nenhum registro para exibir.</div>'; return; }
  box.innerHTML=`<table><thead><tr><th>Nº Sinistro</th><th>Ocorrência</th><th>Segurado</th><th>Situação</th></tr></thead><tbody>${
    Estado.filtrados.map((o,i)=>{
      const sit=campo(o,['situacao','status'],'');
      return `<tr data-i="${i}">
        <td>${esc(campo(o,['numsin','num_sinistro','codigo']))}${Local.temAlgo(idDe(o))?'<span class="marca" title="possui anotações manuais"></span>':''}</td>
        <td>${esc(campo(o,['datoco','data_ocorrencia'],''))}</td>
        <td>${esc(campo(o,['cliente','segurado','nome']))}</td>
        <td>${esc(SITUACAO[sit]||sit)}</td></tr>`;
    }).join('')}</tbody></table>`;
  box.querySelectorAll('tbody tr').forEach(tr=>{
    tr.onclick=()=>{
      box.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel'));
      tr.classList.add('sel');
      Estado.sel=Estado.filtrados[+tr.dataset.i]; Estado.histSel=0; Estado.etapaAberta=null;
      renderDetalhe(); carregarHist();
    };
  });
}

/* ==================================================================
   7. CAMPO EDITÁVEL  (manual sobrepõe API)
   ================================================================== */
function campoEd(chave,rotulo,valorApi,opc={}){
  const id=idSel(), m=Local.campo(id,chave);
  const temManual=m!==undefined;
  const exibido=temManual?m.v:valorApi;
  const mudouNaApi=temManual && String(m.api??'')!==String(valorApi??'');
  return `<div class="ro">
    <label>${rotulo}
      ${temManual?`<span class="acoes" data-restaurar="${esc(chave)}" title="restaurar valor da API">↺ API</span>`:''}
    </label>
    <div class="v ${temManual?'editado':''}" data-ed="${esc(chave)}" data-api="${esc(valorApi??'')}"
         data-multi="${opc.multi?1:0}">${esc(exibido||'')||'<span style="color:#bbb">—</span>'}</div>
    ${mudouNaApi?`<div class="divergencia">A API agora traz “${esc(valorApi)}”.
       <a data-aceitar="${esc(chave)}">usar valor da API</a></div>`:''}
  </div>`;
}
function ligarEdicao(raiz){
  raiz.querySelectorAll('[data-ed]').forEach(el=>{
    el.onclick=()=>{
      if(el.querySelector('input,textarea')) return;
      const chave=el.dataset.ed, api=el.dataset.api, multi=el.dataset.multi==='1';
      const m=Local.campo(idSel(),chave);
      const atual=m!==undefined?m.v:api;
      el.innerHTML = multi
        ? `<textarea rows="4">${esc(atual)}</textarea>`
        : `<input value="${esc(atual)}">`;
      const inp=el.firstChild; inp.focus();
      const salvar=()=>{
        const novo=inp.value;
        if(novo===api) Local.limpaCampo(idSel(),chave);
        else Local.setCampo(idSel(),chave,novo,api);
        renderDetalhe(); renderLista();
      };
      inp.onblur=salvar;
      inp.onkeydown=e=>{
        if(e.key==='Enter'&&!multi){ e.preventDefault(); inp.blur(); }
        if(e.key==='Escape'){ inp.onblur=null; renderDetalhe(); }
      };
    };
  });
  raiz.querySelectorAll('[data-restaurar]').forEach(el=>{
    el.onclick=e=>{ e.stopPropagation(); Local.limpaCampo(idSel(),el.dataset.restaurar); renderDetalhe(); renderLista(); };
  });
  raiz.querySelectorAll('[data-aceitar]').forEach(el=>{
    el.onclick=()=>{ Local.limpaCampo(idSel(),el.dataset.aceitar); renderDetalhe(); };
  });
}

        ${campoEd('oficina','Oficina',campo(o,['oficina'],''))}
        ${campoEd('franquia','Franquia',moeda(campo(o,['franquia','vlfranquia'],0)))}

        ${campoEd('datlib','Dt. Liberação',campo(o,['datlib','data_liberacao'],''))}
        ${campoEd('datenc','Encerramento',campo(o,['datenc','data_encerramento'],''))}

      </div>

function ligarExtras(c){
  const id=idSel();
  const b=c.querySelector('#btn-extra');

    const nome=prompt('Nome do novo campo:'); if(!nome) return;
    const a=Local.extras(id); a.push({id:'x'+Date.now(),rotulo:nome,valor:''});
    Local.setExtras(id,a); renderDetalhe();
  };
  c.querySelectorAll('[data-extra]').forEach(el=>{
    el.onclick=()=>{
      if(el.querySelector('input')) return;
      const a=Local.extras(id), x=a.find(y=>y.id===el.dataset.extra);
      el.innerHTML=`<input value="${esc(x.valor)}">`;
      const i=el.firstChild; i.focus();
      i.onblur=()=>{ x.valor=i.value; Local.setExtras(id,a); renderDetalhe(); };
      i.onkeydown=e=>{ if(e.key==='Enter') i.blur(); };
    };
  });
  c.querySelectorAll('[data-delextra]').forEach(el=>{
    el.onclick=e=>{ e.stopPropagation();
      Local.setExtras(id,Local.extras(id).filter(y=>y.id!==el.dataset.delextra)); renderDetalhe(); };
  });
}

function classeEtapa(s){

  if(s==='Não se aplica')return 'na';

function renderEtapas(c){

              ${esc(e.status||'—')}
              ${e.obs?'<br>'+esc(e.obs):''}
            </div>
            ${aberta?`<div class="form-etapa" data-form="${esc(e.id)}">
              <div class="full"><label>Título</label><input data-f="titulo" value="${esc(e.titulo)}"></div>
              <div class="full"><label>Descrição</label><input data-f="descricao" value="${esc(e.descricao)}"></div>
              <div><label>Status</label><select data-f="status">${
                STATUS_ETAPA.map(s=>`<option ${s===e.status?'selected':''} value="${esc(s)}">${s||'(em branco)'}</option>`).join('')}</select></div>
              <div><label>Responsável</label><input data-f="responsavel" value="${esc(e.responsavel)}"></div>
              <div><label>Data</label><input data-f="data" value="${esc(e.data)}" placeholder="dd/mm/aaaa"></div>
              <div><label>Hora</label><input data-f="hora" value="${esc(e.hora)}" placeholder="hh:mm"></div>
              <div class="full"><label>Observação</label><textarea data-f="obs" rows="2">${esc(e.obs)}</textarea></div>
            </div>`:''}
          </div>

            <button data-ed-etapa="${esc(e.id)}">${aberta?'ok':'editar'}</button>

        </div>`;
      }).join('')}</div>

  c.querySelector('#et-nova').onclick=()=>{
    const a=Local.etapas(id);
    a.push({id:'e'+Date.now(),titulo:'Nova etapa',descricao:'',responsavel:'',status:'',data:'',hora:'',obs:''});
    salvar(a); Estado.etapaAberta=a[a.length-1].id; renderEtapas(c);
  };
  c.querySelectorAll('[data-ed-etapa]').forEach(b=>b.onclick=()=>{
    Estado.etapaAberta = Estado.etapaAberta===b.dataset.edEtapa? null : b.dataset.edEtapa;

    if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; salvar(a); renderEtapas(c); };

/* ==================================================================
   10. HISTÓRICO — API (leitura) + lançamentos manuais (permanentes)
   ================================================================== */
async function carregarHist(){
  const s=Estado.sel,id=idSel(); if(!s||!id) return;
  if(Estado.cacheHist[id]){ atualizaBadges(); return; }
  try{ Estado.cacheHist[id]=await Hist.buscar(s); }catch(e){ Estado.cacheHist[id]={itens:[],origem:'erro'}; }
  atualizaBadges();
  if(Estado.aba==='historico') renderDetalhe();
}
function histCombinado(){
  const id=idSel();
  const api=(Estado.cacheHist[id]?Estado.cacheHist[id].itens:[]).map(x=>({...x,manual:false}));
  const man=Local.historico(id).map(x=>({...x,manual:true}));
  return [...api,...man].sort((a,b)=>ordem(b.data,b.hora)-ordem(a.data,a.hora));
}
function renderHistorico(c){
  const id=idSel(), itens=histCombinado(), r=Estado.cacheHist[id];
  const i=Math.min(Estado.histSel,Math.max(0,itens.length-1)), h=itens[i];
  c.innerHTML=`
    <div class="aviso">Os lançamentos com faixa laranja foram digitados por você e <b>nunca são apagados</b>
      pela sincronização. Origem da API: ${r? esc(String(r.origem)) : 'não consultada'}.
      <button id="h-desc" style="margin-left:8px">Descobrir endpoint da API</button>
      <div id="h-log" style="display:none;font-family:monospace;font-size:11px;margin-top:6px;max-height:150px;overflow:auto"></div>
    </div>
    <div class="painel-form">
      <div class="secao">Histórico <button id="h-novo">+ Novo lançamento manual</button></div>
      ${itens.length? `<div class="hist">
        <div class="hist-lista">
          <div class="cab"><span>Data</span><span>Hora</span></div>
          <div class="rol">${itens.map((x,k)=>`<div class="hist-item ${k===i?'on':''} ${x.manual?'man':''}" data-k="${k}">
            <span>${esc(x.data||'—')}</span><span>${esc(x.hora||'')}</span></div>`).join('')}</div>
        </div>
        <div class="hist-det">
          <div class="hist-topo">
            <div class="ro"><label>Data</label><div class="v">${esc(h.data||'—')}</div></div>
            <div class="ro"><label>Hora</label><div class="v">${esc(h.hora||'—')}</div></div>
            <div class="ro" style="flex:1"><label>Referente ao</label><div class="v">${esc(h.referente||'—')}</div></div>
          </div>
          <div class="secao">Descrição</div>
          <div class="hist-desc">${esc(h.descricao||'')}</div>
          <div style="margin-top:8px;font-size:11px;color:${h.manual?'var(--manual)':'var(--azul)'}">
            ${h.manual?'Lançamento manual — <a href="#" id="h-edit">editar</a> · <a href="#" id="h-del">excluir</a>'
                      :'Lançamento vindo da API (somente leitura)'}
          </div>
        </div></div>`
      : '<div style="color:#888;padding:12px 0">Nenhum lançamento. Use o botão acima para registrar manualmente.</div>'}
    </div>`;

  c.querySelectorAll('.hist-item').forEach(el=>el.onclick=()=>{ Estado.histSel=+el.dataset.k; renderDetalhe(); });

  c.querySelector('#h-novo').onclick=()=>{
    const ag=new Date();
    Local.addHistorico(id,{id:'h'+Date.now(),
      data:prompt('Data (dd/mm/aaaa):',ag.toLocaleDateString('pt-BR'))||ag.toLocaleDateString('pt-BR'),
      hora:prompt('Hora (hh:mm):',ag.toTimeString().slice(0,5))||'',
      referente:prompt('Referente ao:','SEGURADO')||'',
      descricao:prompt('Descrição:')||''});
    Estado.histSel=0; renderDetalhe();
  };
  const ed=c.querySelector('#h-edit');
  if(ed) ed.onclick=e=>{ e.preventDefault();
    const arr=Local.historico(id), x=arr.find(y=>y.id===h.id);
    x.data=prompt('Data:',x.data)??x.data; x.hora=prompt('Hora:',x.hora)??x.hora;
    x.referente=prompt('Referente ao:',x.referente)??x.referente;
    x.descricao=prompt('Descrição:',x.descricao)??x.descricao;
    Local.setHistorico(id,arr); renderDetalhe(); };
  const dl=c.querySelector('#h-del');
  if(dl) dl.onclick=e=>{ e.preventDefault();
    if(!confirm('Excluir este lançamento manual?')) return;
    Local.setHistorico(id,Local.historico(id).filter(y=>y.id!==h.id)); Estado.histSel=0; renderDetalhe(); };

  c.querySelector('#h-desc').onclick=async()=>{
    const log=c.querySelector('#h-log'); log.style.display='block'; log.innerHTML='Testando...<br>';
    const achou=await Hist.descobrir(Estado.sel,(u,m,ok)=>{
      log.insertAdjacentHTML('beforeend',`<div style="color:${ok?'#0a6b2d':'#999'}">${ok?'✔':'·'} ${esc(u)} → ${esc(m)}</div>`); });
    if(achou){ delete Estado.cacheHist[id]; await carregarHist(); renderDetalhe(); }
    else log.insertAdjacentHTML('beforeend','<div style="color:#b00020">Nenhum endpoint respondeu com histórico.</div>');
  };
}

/* ==================================================================
   11. ANOTAÇÕES LIVRES
   ================================================================== */
function renderNotas(c){
  const id=idSel();
  c.innerHTML=`<div class="painel-form">
    <div class="secao">Anotações livres <span style="font-weight:400;text-transform:none;color:#888;font-size:10px">salvo automaticamente</span></div>
    <textarea id="nt" style="width:100%;min-height:280px;border:1px solid var(--borda);border-radius:3px;padding:10px;font-size:13px;line-height:1.6"
      placeholder="Anotações internas sobre este sinistro...">${esc(Local.notas(id))}</textarea>
    <div style="font-size:11px;color:#888;margin-top:6px" id="nt-st"></div></div>`;
  let t;
  const ta=c.querySelector('#nt');
  ta.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{ Local.setNotas(id,ta.value);
    c.querySelector('#nt-st').textContent='Salvo em '+new Date().toLocaleTimeString('pt-BR'); renderLista(); },600); };
}

/* ==================================================================
   12. BADGES E EVENTOS
   ================================================================== */
function atualizaBadges(){
  const id=idSel(); if(!id) return;
  const et=Local.etapas(id).filter(e=>e.status||e.responsavel||e.data||e.obs).length;
  const be=$('#bd-etapas'); be.style.display=et?'inline-block':'none'; be.textContent=et;
  const h=histCombinado().length;
  const bh=$('#bd-hist'); bh.style.display=h?'inline-block':'none'; bh.textContent=h;
}
document.querySelectorAll('.aba').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('.aba').forEach(x=>x.classList.remove('on'));
  a.classList.add('on'); Estado.aba=a.dataset.aba; if(Estado.sel) renderDetalhe();
});
$('#f-btn').onclick=()=>sincronizar(1);
$('#pg-ant').onclick=()=>sincronizar(Math.max(1,Estado.pagina-1));
$('#pg-prox').onclick=()=>sincronizar(Estado.pagina+1);
$('#f-texto').oninput=filtrar;
$('#f-reset').onclick=()=>{ $('#f-texto').value=''; $('#f-situacao').value='T'; $('#f-tipo').value='S'; filtrar(); };

if(Api.restaurar()) abrirApp();
</script>
</body>
</html>
