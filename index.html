<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinistro360 — Integração CORP</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
  --brand:#2563eb; --brand-dark:#1e293b; --ok:#16a34a; --warn:#f59e0b; --danger:#dc2626;
  --chip:#eff6ff; --chip-ink:#2563eb; --sidebar:#0f172a; --sidebar-ink:#cbd5e1;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:var(--brand);text-decoration:none}
.hidden{display:none!important}
/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--sidebar);color:var(--sidebar-ink);flex-shrink:0;display:flex;flex-direction:column;padding:0}
.sidebar .brand{padding:18px 20px;font-size:18px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1e293b}
.sidebar nav{padding:10px 0;flex:1}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--sidebar-ink);font-size:14px;cursor:pointer}
.sidebar nav a:hover{background:#1e293b;color:#fff}
.sidebar nav a.active{background:var(--brand);color:#fff}
.sidebar .ver{padding:12px 20px;font-size:11px;color:#475569}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar .crumb{color:var(--muted);font-size:13px}
.topbar .user{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.content{padding:24px;overflow:auto}
/* Componentes */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.page-head h1{margin:0;font-size:22px}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.btn{background:var(--brand);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{opacity:.92}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.danger{background:var(--danger)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600}
.field{margin-bottom:14px}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:1fr 1fr}
.grid.c3{grid-template-columns:1fr 1fr 1fr}
.grid.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}}
/* Chips / filtros */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip-btn{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.blue{background:#eff6ff;color:#2563eb}.badge.green{background:#dcfce7;color:#16a34a}
.badge.amber{background:#fef3c7;color:#b45309}.badge.red{background:#fee2e2;color:#dc2626}
.badge.gray{background:#f1f5f9;color:#64748b}.badge.purple{background:#f3e8ff;color:#9333ea}
/* Tabela */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;min-width:150px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#f8fafc}
.mono{font-variant-numeric:tabular-nums}
/* Detalhe */
.detail-head{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.detail-head h1{margin:0 0 6px;font-size:20px}
.detail-head .sub{color:var(--muted);font-size:13px}
.detail-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs .tab{padding:10px 16px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;border-bottom:2px solid transparent}
.tabs .tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.kv{display:grid;grid-template-columns:200px 1fr;gap:2px 16px}
.kv dt{color:var(--muted);padding:8px 0;font-size:12px;border-bottom:1px solid #f1f5f9}
.kv dd{margin:0;padding:8px 0;font-size:13px;border-bottom:1px solid #f1f5f9;word-break:break-word}
/* Jornada / Timeline */
.journey{position:relative;padding-left:8px}
.jstep{display:flex;gap:14px;position:relative;padding-bottom:22px}
.jstep::before{content:"";position:absolute;left:11px;top:26px;bottom:-4px;width:2px;background:var(--line)}
.jstep:last-child::before{display:none}
.jdot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:var(--line);z-index:1}
.jdot.done{background:var(--ok)}.jdot.current{background:var(--brand);box-shadow:0 0 0 4px #dbeafe}.jdot.pending{background:#cbd5e1}
.jbody{flex:1;padding-top:1px}
.jbody h4{margin:0 0 3px;font-size:14px}
.jbody .jmeta{color:var(--muted);font-size:12px}
.jbody .jdate{color:var(--ok);font-size:12px;font-weight:600}
/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e3a8a)}
.login-box{background:#fff;border-radius:16px;padding:36px;width:380px;max-width:92vw}
.login-box h1{margin:0 0 4px;font-size:22px}
.login-box p{margin:0 0 22px;color:var(--muted);font-size:13px}
.status{padding:10px 12px;border-radius:8px;font-size:13px;margin-top:12px}
.status.ok{background:#dcfce7;color:#166534}.status.err{background:#fee2e2;color:#991b1b}.status.info{background:#eff6ff;color:#1e40af}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.stat-cards{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .n{font-size:26px;font-weight:700}.stat .l{color:var(--muted);font-size:12px;margin-top:2px}
.muted{color:var(--muted)}
.right{text-align:right}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =========================================================================
   Sinistro360 — versão reconstruída focada na integração com a API CORP
   Campos reais da API (do _raw): codfil, nosnum, tipo, cia, ramo, codigo,
   numapo, numend, item, valavi, valind, segurado, numsin, datavi, datoco,
   datenc, situacao, placa, franquia, responsavel, oficina, tipo_atendimento,
   descricao, observacoes, proxima_agenda, agendamento, datvis, datlib, valdes
   ========================================================================= */

/* ---------- Utilitários ---------- */
var U = {
  el:function(tag,attrs,children){
    var e=document.createElement(tag); attrs=attrs||{};
    for(var k in attrs){
      if(k==="text") e.textContent=attrs[k];
      else if(k==="html") e.innerHTML=attrs[k];
      else if(k==="class") e.className=attrs[k];
      else if(k.indexOf("on")===0 && typeof attrs[k]==="function") e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
      else if(attrs[k]!=null) e.setAttribute(k,attrs[k]);
    }
    (children||[]).forEach(function(c){ if(c!=null) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
    return e;
  },
  uid:function(p){return (p||"id")+"_"+Math.random().toString(36).slice(2,9);},
  fmtDateBR:function(iso){ if(!iso) return "—"; var m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m?(m[3]+"/"+m[2]+"/"+m[1]):iso; },
  isoFromBR:function(v){ if(!v) return ""; v=String(v).trim(); var m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(m) return m[3]+"-"+m[2]+"-"+m[1]; var i=v.match(/^(\d{4})-(\d{2})-(\d{2})/); return i?(i[1]+"-"+i[2]+"-"+i[3]):""; },
  todayISO:function(){var d=new Date();return d.toISOString().slice(0,10);},
  money:function(v){ v=Number(v)||0; return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); },
  val:function(v){ return (v==null||v===""||v==="0"||v===0)?"—":v; },
  txt:function(v){ return (v==null||v==="")?"—":String(v); }
};

/* ---------- Configuração / storage ---------- */
var CFG_KEY="corp_cfg", TOKEN_KEY="corp_token", DATA_KEY="corp_claims";
function getCfg(){ try{return JSON.parse(localStorage.getItem(CFG_KEY))||{};}catch(e){return {};} }
function setCfg(c){ localStorage.setItem(CFG_KEY,JSON.stringify(c)); }
function getToken(){ return localStorage.getItem(TOKEN_KEY)||""; }
function setToken(t){ if(t) localStorage.setItem(TOKEN_KEY,t); else localStorage.removeItem(TOKEN_KEY); }
function loadClaims(){ try{return JSON.parse(localStorage.getItem(DATA_KEY))||[];}catch(e){return [];} }
function saveClaims(a){ localStorage.setItem(DATA_KEY,JSON.stringify(a)); }

/* ---------- Camada de API CORP ---------- */
var CorpAPI=(function(){
  function base(){ var u=(getCfg().url||"").trim().replace(/\/+$/,""); if(u && !/^https?:\/\//.test(u)) u="https://"+u; return u; }
  function request(path,opts){
    opts=opts||{};
    var headers={};
    if(opts.body) headers["Content-Type"]="application/json";
    if(opts.auth!==false){ var t=getToken(); if(t) headers["Authorization"]=t; }
    return fetch(base()+path,{
      method:opts.method||"GET",
      headers:headers,
      body:opts.body?JSON.stringify(opts.body):undefined
    }).then(function(r){
      return r.text().then(function(txt){
        var data; try{data=JSON.parse(txt);}catch(e){data=txt;}
        if(!r.ok){ var msg=(data&&data.message)||(data&&data.mensagem)||("HTTP "+r.status); var err=new Error(msg); err.status=r.status; err.data=data; throw err; }
        return data;
      });
    });
  }
  function login(){
    var c=getCfg();
    return request("/login",{method:"POST",auth:false,body:{email:c.email,senha:c.senha,aplicacao:Number(c.aplicacao||0)}})
      .then(function(resp){
        var token=resp&&(resp.token||resp.access_token||(resp.dados&&resp.dados.token)||(resp.data&&resp.data.token));
        if(!token) throw new Error("Login sem token na resposta.");
        setToken(token); return token;
      });
  }
  function withAuth(fn){
    if(!getToken()) return login().then(fn);
    return fn().catch(function(e){ if(e.status===401){ setToken(""); return login().then(fn); } throw e; });
  }
  function fetchSinistros(params){
    params=params||{};
    var hoje=new Date(), ini=new Date(); ini.setFullYear(hoje.getFullYear()-5);
    function br(d){var dd=("0"+d.getDate()).slice(-2),mm=("0"+(d.getMonth()+1)).slice(-2);return dd+"/"+mm+"/"+d.getFullYear();}
    var def={tipo_sinistro:"S",data_inicial:br(ini),data_final:br(hoje),tipo_data:"OCO",situacao:"T",qtd_pag:100,pagina:1};
    for(var k in params) def[k]=params[k];
    var qs=Object.keys(def).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(def[k]);}).join("&");
    return withAuth(function(){ return request("/sinistros?"+qs,{method:"GET"}); });
  }
  function testConnection(){ setToken(""); return login().then(function(){return true;}); }
  return {login:login,fetchSinistros:fetchSinistros,testConnection:testConnection,base:base};
})();

/* ---------- Mapeamento CORP -> registro interno (TODOS os campos) ---------- */
function mapSituacao(s){
  s=String(s||"").toUpperCase();
  if(s.indexOf("INDENIZ")>=0) return {label:"Indenizado",cls:"green"};
  if(s.indexOf("ENCERR")>=0)  return {label:"Encerrado",cls:"gray"};
  if(s.indexOf("ANDAMENTO")>=0)return {label:"Em andamento",cls:"amber"};
  if(s.indexOf("PENDENTE")>=0) return {label:"Pendente",cls:"amber"};
  if(s.indexOf("NEGAD")>=0||s.indexOf("RECUS")>=0) return {label:"Negado",cls:"red"};
  if(s.indexOf("ABERT")>=0)    return {label:"Aberto",cls:"blue"};
  return {label:(s||"—"),cls:"blue"};
}
function mapCorp(c){
  return {
    id:"clm_"+(c.codfil||"0")+"_"+(c.nosnum||U.uid("")),
    // Identificação
    codfil:c.codfil, nosnum:c.nosnum, numsin:c.numsin||"", tipo:c.tipo||"", codigo:c.codigo,
    // Cliente
    segurado:c.segurado||"", cpfcnpj:c.cpfcnpj||c.documento||"",
    // Apólice / produto
    cia:c.cia||"", ramo:c.ramo||"", numapo:c.numapo||"", numend:c.numend||"", item:c.item,
    // Veículo
    placa:c.placa||"",
    // Situação / valores
    situacao:c.situacao||"", franquia:Number(c.franquia)||0,
    valavi:Number(c.valavi)||0, valind:Number(c.valind)||0, valdes:Number(c.valdes)||0,
    // Datas
    datavi:U.isoFromBR(c.datavi), datoco:U.isoFromBR(c.datoco), datenc:U.isoFromBR(c.datenc),
    datvis:U.isoFromBR(c.datvis), datlib:U.isoFromBR(c.datlib),
    proxima_agenda:U.isoFromBR(c.proxima_agenda), agendamento:U.isoFromBR(c.agendamento),
    // Atendimento
    responsavel:c.responsavel||"", oficina:c.oficina?String(c.oficina).trim():"",
    tipo_atendimento:c.tipo_atendimento||"", descricao:c.descricao||"", observacoes:c.observacoes||"",
    _raw:c
  };
}

/* ---------- Jornada do cliente (etapas derivadas dos dados da API) ---------- */
function buildJourney(c){
  var steps=[
    {key:"aviso",   title:"Aviso de sinistro",        date:c.datavi, meta:"Sinistro comunicado à seguradora"},
    {key:"ocorr",   title:"Ocorrência registrada",    date:c.datoco, meta:"Data do evento"},
    {key:"vistoria",title:"Vistoria",                 date:c.datvis, meta:c.oficina?("Oficina: "+c.oficina):"Vistoria do veículo"},
    {key:"analise", title:"Análise / atendimento",    date:c.agendamento, meta:(c.responsavel?("Responsável: "+c.responsavel):"Em análise")},
    {key:"liberacao",title:"Liberação",               date:c.datlib, meta:"Liberação do processo"},
    {key:"encerr",  title:"Encerramento",             date:c.datenc, meta:mapSituacao(c.situacao).label}
  ];
  // marca estado de cada etapa
  var lastDoneIdx=-1;
  steps.forEach(function(s,i){ if(s.date) lastDoneIdx=i; });
  steps.forEach(function(s,i){
    if(s.date) s.state=(i<lastDoneIdx?"done":"done");
    else s.state=(i===lastDoneIdx+1?"current":"pending");
  });
  // Se encerrado/indenizado, tudo concluído
  var sit=mapSituacao(c.situacao).label;
  if(sit==="Indenizado"||sit==="Encerrado"){ steps.forEach(function(s){s.state="done";}); }
  return steps;
}

/* =========================================================================
   ESTADO DA APLICAÇÃO E ROTEAMENTO
   ========================================================================= */
var State={ route:"dashboard", param:null, claims:loadClaims(), session:{name:"Marina Costa",role:"Administrador"} };

function navigate(route,param){ State.route=route; State.param=param||null; location.hash="#/"+route+(param?"/"+param:""); render(); }
window.addEventListener("hashchange",function(){
  var h=location.hash.replace(/^#\//,"").split("/");
  if(h[0] && h[0]!==State.route || (h[1]||null)!==State.param){ State.route=h[0]||"dashboard"; State.param=h[1]||null; render(); }
});

/* =========================================================================
   SHELL (sidebar + topbar)
   ========================================================================= */
var MENU=[
  ["dashboard","Dashboard","▣"],
  ["sinistros","Sinistros","⚠"],
  ["clientes","Clientes","☺"],
  ["seguradoras","Seguradoras","⛨"],
  ["oficinas","Oficinas/Prestadores","⚒"],
  ["relatorios","Relatórios","▦"],
  ["integracao","Integração CORP","⟳"],
  ["config","Configurações","⚙"]
];
function shell(inner,crumb){
  var nav=U.el("nav",{}, MENU.map(function(m){
    return U.el("a",{class:(State.route===m[0]?"active":""),onclick:function(){navigate(m[0]);}},[
      U.el("span",{text:m[2]}), U.el("span",{text:m[1]})
    ]);
  }));
  var side=U.el("div",{class:"sidebar"},[
    U.el("div",{class:"brand"},[U.el("span",{text:"◆"}),U.el("span",{text:"Sinistro360"})]),
    nav,
    U.el("div",{class:"ver",text:"v2.0 • Integração CORP"})
  ]);
  var initials=State.session.name.split(" ").map(function(w){return w[0];}).slice(0,2).join("");
  var top=U.el("div",{class:"topbar"},[
    U.el("div",{class:"crumb",text:"Sinistro360 › "+(crumb||"")}),
    U.el("div",{class:"user"},[
      U.el("div",{},[U.el("div",{text:State.session.name,style:"font-weight:600"}),U.el("div",{class:"muted",style:"font-size:11px",text:State.session.role})]),
      U.el("div",{class:"avatar",text:initials})
    ])
  ]);
  var main=U.el("div",{class:"main"},[top,U.el("div",{class:"content"},[inner])]);
  return U.el("div",{class:"app"},[side,main]);
}

/* =========================================================================
   PÁGINAS
   ========================================================================= */
var Pages={};

/* ----- Dashboard ----- */
Pages.dashboard=function(){
  var cs=State.claims;
  var byStatus={};
  cs.forEach(function(c){ var l=mapSituacao(c.situacao).label; byStatus[l]=(byStatus[l]||0)+1; });
  var totalInd=cs.reduce(function(a,c){return a+(c.valind||0);},0);
  var cards=U.el("div",{class:"stat-cards"},[
    stat(cs.length,"Sinistros sincronizados"),
    stat(byStatus["Em andamento"]||0,"Em andamento"),
    stat(byStatus["Indenizado"]||0,"Indenizados"),
    stat(U.money(totalInd),"Total indenizado")
  ]);
  var recent=U.el("div",{class:"card"},[
    U.el("h3",{text:"Últimos sinistros",style:"margin-top:0"}),
    cs.length?claimsTable(cs.slice(0,8)):emptyState("Nenhum sinistro sincronizado ainda.")
  ]);
  return shell(U.el("div",{},[
    U.el("div",{class:"page-head"},[U.el("div",{},[U.el("h1",{text:"Dashboard"}),U.el("p",{text:"Visão geral dos sinistros importados da API CORP"})])]),
    cards, recent
  ]),"Dashboard");
};
function stat(n,l){ return U.el("div",{class:"stat"},[U.el("div",{class:"n",text:String(n)}),U.el("div",{class:"l",text:l})]); }
function emptyState(msg){ return U.el("div",{class:"muted",style:"padding:30px;text-align:center",text:msg}); }

/* ----- Lista de Sinistros ----- */
var listFilter={status:"todos",q:""};
Pages.sinistros=function(){
  var chips=[["todos","Todos"],["Aberto","Abertos"],["Em andamento","Em andamento"],["Pendente","Pendentes"],["Indenizado","Indenizados"],["Encerrado","Encerrados"],["Negado","Negados"]];
  var chipRow=U.el("div",{class:"chips"},chips.map(function(c){
    return U.el("div",{class:"chip-btn"+(listFilter.status===c[0]?" active":""),text:c[1],onclick:function(){listFilter.status=c[0];render();}});
  }));
  var search=U.el("input",{placeholder:"Buscar por segurado, placa, nº sinistro, apólice...",value:listFilter.q,oninput:function(e){listFilter.q=e.target.value;renderList();}});
  var toolbar=U.el("div",{class:"toolbar"},[search,
    U.el("button",{class:"btn sec sm",text:"Exportar CSV",onclick:exportCSV}),
    U.el("button",{class:"btn ghost sm",text:"↻ Sincronizar agora",onclick:function(){navigate("integracao");}})
  ]);
  var listWrap=U.el("div",{id:"listWrap"});
  function renderList(){
    var q=listFilter.q.toLowerCase();
    var rows=State.claims.filter(function(c){
      if(listFilter.status!=="todos" && mapSituacao(c.situacao).label!==listFilter.status) return false;
      if(!q) return true;
      return [c.segurado,c.placa,c.numsin,c.numapo,c.cia].join(" ").toLowerCase().indexOf(q)>=0;
    });
    listWrap.innerHTML="";
    listWrap.appendChild(rows.length?claimsTable(rows):emptyState("Nenhum sinistro encontrado com esses filtros."));
  }
  setTimeout(renderList,0);
  return shell(U.el("div",{},[
    U.el("div",{class:"page-head"},[
      U.el("div",{},[U.el("h1",{text:"Sinistros"}),U.el("p",{text:"Todos os sinistros trazidos da API CORP ("+State.claims.length+" registros)"})]),
      U.el("button",{class:"btn",text:"↻ Sincronizar",onclick:function(){navigate("integracao");}})
    ]),
    U.el("div",{class:"card"},[chipRow,toolbar,listWrap])
  ]),"Sinistros");
};
function claimsTable(rows){

/* =========================================================================
   SINCRONIZAÇÃO (percorre todas as páginas)
   ========================================================================= */
function syncAll(){
  var novos=0,atualizados=0,total=0;
  var byId={}; State.claims.forEach(function(c){byId[c.id]=c;});
  function pagina(p){
    return CorpAPI.fetchSinistros({pagina:p}).then(function(resp){
      var arr=Array.isArray(resp)?resp:((resp&&(resp.sinistros||resp.sinistro||resp.dados||resp.data||resp.itens||resp.registros))||[]);
      arr.forEach(function(raw){
        var m=mapCorp(raw);
        if(byId[m.id]){ atualizados++; } else { novos++; }
        byId[m.id]=m;
      });
      total+=arr.length;
      if(arr.length>=100 && p<100){ return pagina(p+1); }
      // finaliza
      State.claims=Object.keys(byId).map(function(k){return byId[k];});
      saveClaims(State.claims);
      return {total:State.claims.length,novos:novos,atualizados:atualizados};
    });
  }
  return pagina(1);
}

/* ----- Exportar CSV ----- */
function exportCSV(){
  var cols=["numsin","segurado","placa","cia","ramo","situacao","numapo","datoco","datavi","datenc","valavi","valind","franquia","responsavel","oficina"];
  var head=cols.join(";");
  var lines=State.claims.map(function(c){return cols.map(function(k){var v=c[k];if(/^dat|^data/.test(k))v=U.fmtDateBR(v);return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(";");});
  var csv=head+"\n"+lines.join("\n");
  var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
  var a=U.el("a",{href:URL.createObjectURL(blob),download:"sinistros_corp.csv"}); document.body.appendChild(a); a.click(); a.remove();
}

  var root=document.getElementById("root");

(function(){

  if(h[0]){ State.route=h[0]; State.param=h[1]||null; }
  render();
})();
